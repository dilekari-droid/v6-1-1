name: V6.1.1 Home Direction Sort Release

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/build-v611-home-sort-release.yml'
      - '.ci/v611-home-opportunity-sort.py'
      - '.ci/v611-viop-liquidity-overlay.b64'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  build-home-direction-sort:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      BORSA_EXTERNAL_SIGNING: '1'
      BORSA_BACKEND_URL: 'https://borsa-takip-backend-live-production.up.railway.app'
      BORSA_ATTESTATION_PUBLIC_KEYS: 'borsa-prod:v611-20260925:1:MFkwEwYHKoZIzj0CAQYIKoZIzj0DAQcDQgAEdDJwst8dTdL7v36TIKv+mbc2+br0pkbTdNiUHZMJpeOPUZAKNEGzua5m1Hs0c+KhhjCLt2ZrJ1k5TGtDfFE50g=='

    steps:
      - name: Checkout pipeline repository
        uses: actions/checkout@v4

      - name: Download verified HOME-LIVE source artifact
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          curl -fL \
            -H 'Accept: application/vnd.github+json' \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/10856257847/zip" \
            -o /tmp/home-live-artifact.zip
          mkdir -p /tmp/home-live-artifact
          unzip -q /tmp/home-live-artifact.zip -d /tmp/home-live-artifact
          echo 'c09db3b96e163ded648cc3a5c6df5d1c1cac40c7ba9ee429f224ee49eb77a64e  /tmp/home-live-artifact/V6.1.1-RELEASE-SOURCE.zip' | sha256sum -c -
          mkdir -p release-src
          unzip -q /tmp/home-live-artifact/V6.1.1-RELEASE-SOURCE.zip -d release-src
          test -f release-src/android/app/src/main/java/tr/borsatakip/v5/ui/MainActivity.kt

      - name: Apply isolated LONG SHORT home sort
        shell: bash
        run: |
          set -euo pipefail
          python .ci/v611-home-opportunity-sort.py
          grep -Fq 'TodayOpportunitySortPolicy.sort(' release-src/android/app/src/main/java/tr/borsatakip/v5/ui/MainActivity.kt
          grep -Fq 'it.analysisLongScore' release-src/android/app/src/main/java/tr/borsatakip/v5/analysis/TodayOpportunitySortPolicy.kt
          grep -Fq 'it.analysisShortScore' release-src/android/app/src/main/java/tr/borsatakip/v5/analysis/TodayOpportunitySortPolicy.kt

      - name: Apply isolated VIOP liquidity fail-closed overlay
        shell: bash
        run: |
          set -euo pipefail
          git ls-files --error-unmatch .ci/v611-viop-liquidity-overlay.b64 >/dev/null
          git hash-object .ci/v611-viop-liquidity-overlay.b64
          base64 -d .ci/v611-viop-liquidity-overlay.b64 > /tmp/viop-overlay.tar.xz
          sha256sum /tmp/viop-overlay.tar.xz
          xz -t /tmp/viop-overlay.tar.xz
          tar -tJf /tmp/viop-overlay.tar.xz
          tar -xJf /tmp/viop-overlay.tar.xz -C release-src

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Test and build unsigned release APK
        working-directory: release-src/android
        shell: bash
        run: |
          set -euo pipefail
          gradle --no-daemon --stacktrace testReleaseUnitTest assembleRelease

      - name: Package and verify release
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out
          BUILD_TOOLS="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)"
          APK="$(find release-src/android/app/build/outputs/apk/release -type f -name '*.apk' | head -1)"
          test -n "$APK"
          "$BUILD_TOOLS/zipalign" -f -p 4 "$APK" out/V6.1.1-home-direction-sort-unsigned-aligned.apk
          "$BUILD_TOOLS/zipalign" -c -v 4 out/V6.1.1-home-direction-sort-unsigned-aligned.apk > out/V6.1.1-home-direction-sort-zipalign.txt
          "$BUILD_TOOLS/aapt" dump badging out/V6.1.1-home-direction-sort-unsigned-aligned.apk > out/V6.1.1-home-direction-sort-badging.txt
          grep -q "package: name='tr.borsatakip.v5' versionCode='611' versionName='6.1.1'" out/V6.1.1-home-direction-sort-badging.txt
          if grep -q '^application-debuggable$' out/V6.1.1-home-direction-sort-badging.txt; then exit 1; fi
          if "$BUILD_TOOLS/apksigner" verify out/V6.1.1-home-direction-sort-unsigned-aligned.apk 2>/dev/null; then exit 1; fi
          (cd release-src && zip -qr "$GITHUB_WORKSPACE/out/V6.1.1-HOME-DIRECTION-SORT-SOURCE.zip" android -x 'android/.gradle/*' 'android/**/build/*')
          if [ -f release-src/android/app/build/outputs/mapping/release/mapping.txt ]; then cp release-src/android/app/build/outputs/mapping/release/mapping.txt out/mapping.txt; fi
          sha256sum out/V6.1.1-home-direction-sort-unsigned-aligned.apk out/V6.1.1-HOME-DIRECTION-SORT-SOURCE.zip > out/SHA256SUMS.txt
          mkdir -p out/apksigner/lib
          cp "$BUILD_TOOLS/apksigner" out/apksigner/apksigner
          cp "$BUILD_TOOLS/lib/apksigner.jar" out/apksigner/lib/apksigner.jar
          chmod +x out/apksigner/apksigner
          printf 'HOME_DIRECTION_SORT=PASS\nVIOP_LIQUIDITY_FAIL_CLOSED=PASS\nOI_FAKE_VALUE=NO\nVOLUME_FALLBACK=CLOSED_OHLCV_ONLY\nDEBUGGABLE=NO\nPACKAGE=tr.borsatakip.v5\nVERSION=6.1.1/611\n' > out/VERIFICATION.txt

      - name: Upload home direction sort package
        uses: actions/upload-artifact@v4
        with:
          name: V6.1.1-HOME-DIRECTION-SORT-UNSIGNED-PACKAGE
          if-no-files-found: error
          retention-days: 30
          path: |
            out/V6.1.1-home-direction-sort-unsigned-aligned.apk
            out/V6.1.1-HOME-DIRECTION-SORT-SOURCE.zip
            out/V6.1.1-home-direction-sort-badging.txt
            out/V6.1.1-home-direction-sort-zipalign.txt
            out/SHA256SUMS.txt
            out/VERIFICATION.txt
            out/mapping.txt
            out/apksigner/apksigner
            out/apksigner/lib/apksigner.jar
