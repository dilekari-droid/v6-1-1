name: V6.1.1 Background OHLCV Verified APK Build

on:
  push:
    branches: [ main ]
    paths:
      - '.ci/v611-bg-ohlcv-xz/**'
      - '.github/workflows/build-v611-bg-ohlcv.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-test-build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout V6.1.1 payload repository
        uses: actions/checkout@v4

      - name: Checkout pinned V5 Android base
        uses: actions/checkout@v4
        with:
          repository: dilekari-droid/v5.1.1
          ref: 28c18f669970f5a7621e89b80179c63c94b6f7aa
          path: base-v5

      - name: Reconstruct and verify V6.1.1 overlay and background patch
        shell: bash
        run: |
          set -euo pipefail
          ROOT='.ci/v611-overlay-r3'
          PARTS=(part00.b64 part01.b64 part02.b64 part03.b64 part04.b64 part05a.b64 part05b.b64 part06a.b64 part06b.b64 part07a.b64 part07b.b64 part08a.b64 part08b.b64 part09.b64)
          : > /tmp/v611-overlay.b64
          for part in "${PARTS[@]}"; do test -s "$ROOT/$part"; cat "$ROOT/$part" >> /tmp/v611-overlay.b64; done
          test "$(wc -c < /tmp/v611-overlay.b64)" -eq 73804
          base64 -d /tmp/v611-overlay.b64 > /tmp/v611-overlay.tar.xz
          echo '29989105d1adb64dcd6fb4a514f803adebfd693b07fe3ddbfe775127751e04fc  /tmp/v611-overlay.tar.xz' | sha256sum -c -
          xz --test /tmp/v611-overlay.tar.xz

          PATCH_ROOT='.ci/v611-bg-ohlcv-xz'
          : > /tmp/v611-bg.b64
          for part in part00.b64 part01.b64 part02.b64 part03.b64 part04.b64 part05.b64 part06.b64; do test -s "$PATCH_ROOT/$part"; cat "$PATCH_ROOT/$part" >> /tmp/v611-bg.b64; done
          test "$(wc -c < /tmp/v611-bg.b64)" -eq 11416
          base64 -d /tmp/v611-bg.b64 > /tmp/v611-bg.py.xz
          echo '23e5654c5d1690a9a84979d84a846888ba275f456f115125e913d33bb60aae8e  /tmp/v611-bg.py.xz' | sha256sum -c -
          xz --test /tmp/v611-bg.py.xz
          xz -dc /tmp/v611-bg.py.xz > /tmp/v611-bg.py
          echo '522e24842308acd77817afa0184be225d6c01eef588390a57c6f532fec854a1f  /tmp/v611-bg.py' | sha256sum -c -
          python -m py_compile /tmp/v611-bg.py

      - name: Apply overlay and all verified source fixes
        shell: bash
        run: |
          set -euo pipefail
          ANDROID_DIR="$GITHUB_WORKSPACE/base-v5/android"
          tar -xJf /tmp/v611-overlay.tar.xz -C "$ANDROID_DIR"
          test -f "$ANDROID_DIR/DELETE-LIST.txt"
          while IFS= read -r rel; do test -n "$rel" || continue; rm -f -- "$ANDROID_DIR/$rel"; done < "$ANDROID_DIR/DELETE-LIST.txt"
          rm -f "$ANDROID_DIR/DELETE-LIST.txt"
          grep -q 'applicationId = "tr.borsatakip.v5"' "$ANDROID_DIR/app/build.gradle.kts"
          grep -q 'versionCode = 556' "$ANDROID_DIR/app/build.gradle.kts"
          grep -q 'versionName = "5.4.16"' "$ANDROID_DIR/app/build.gradle.kts"

          python "$GITHUB_WORKSPACE/.ci/v611-uiux-v6-fixes.py" "$ANDROID_DIR"
          python "$GITHUB_WORKSPACE/.ci/v611-uiux-v6-copy-fixes.py" "$ANDROID_DIR"
          python "$GITHUB_WORKSPACE/.ci/v611-uiux-v6-favorites-failclosed.py" "$ANDROID_DIR"
          python "$GITHUB_WORKSPACE/.ci/v611-uiux-v6-state-failclosed.py" "$ANDROID_DIR"
          python /tmp/v611-bg.py "$ANDROID_DIR"

          SRC="$ANDROID_DIR/app/src/main/java/tr/borsatakip/v5"
          grep -q 'versionCode = 611' "$ANDROID_DIR/app/build.gradle.kts"
          grep -q 'versionName = "6.1.1"' "$ANDROID_DIR/app/build.gradle.kts"
          grep -Fq 'https://borsa-takip-backend-live-production.up.railway.app' "$ANDROID_DIR/app/build.gradle.kts"
          grep -Fq '<string name="app_name">V6.1.1</string>' "$ANDROID_DIR/app/src/main/res/values/strings.xml"
          grep -Fq 'START_REDELIVER_INTENT' "$SRC/worker/BistScanForegroundService.kt"
          grep -Fq 'SCAN_SCREEN_LOCKED' "$SRC/worker/ScanScreenStateMonitor.kt"
          grep -Fq 'SCAN_CYCLE_COMPLETED' "$SRC/worker/BistScanForegroundService.kt"
          grep -Fq 'Hisse taraması devam ediyor • Son tarama:' "$SRC/worker/AutoScanForegroundService.kt"
          grep -Fq 'ScanResultSortPolicy.directional' "$SRC/ui/ScanResultsActivity.kt"
          grep -Fq 'THIRTY_MIN("30 DK"' "$SRC/analysis/ChartTimeframe.kt"
          grep -Fq 'FOUR_HOUR("4 SA"' "$SRC/analysis/ChartTimeframe.kt"
          grep -Fq 'EMA21 ✓' "$SRC/ui/StockDetailActivity.kt"
          grep -Fq 'OHLCV_FLOW' "$SRC/ui/StockDetailActivity.kt"
          grep -Fq 'OHLCV_RAW' "$SRC/data/MobileMarketDataProvider.kt"
          test -f "$ANDROID_DIR/app/src/test/java/tr/borsatakip/v5/ui/ScanResultSortPolicyTest.kt"
          test -f "$ANDROID_DIR/app/src/test/java/tr/borsatakip/v5/analysis/ChartTimeframeContractTest.kt"
          echo "ANDROID_DIR=$ANDROID_DIR" >> "$GITHUB_ENV"
          echo 'SELECTED_SOURCE=verified R3 overlay + prior UIUX fail-closed fixes + V6.1.1 background/lock/OHLCV fixes' >> "$GITHUB_ENV"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Run Android unit tests
        working-directory: ${{ env.ANDROID_DIR }}
        run: gradle --no-daemon --stacktrace testDebugUnitTest

      - name: Build debug APK
        working-directory: ${{ env.ANDROID_DIR }}
        run: gradle --no-daemon --stacktrace assembleDebug

      - name: Locate and verify APK
        shell: bash
        run: |
          set -euo pipefail
          APK="$(find "$ANDROID_DIR/app/build/outputs/apk/debug" -type f -name '*.apk' | head -1)"
          test -n "$APK"
          mkdir -p out
          cp "$APK" out/V6.1.1-BG-OHLCV-debug.apk
          sha256sum out/V6.1.1-BG-OHLCV-debug.apk | tee out/V6.1.1-BG-OHLCV-debug.apk.sha256
          printf 'source=%s\n' "$SELECTED_SOURCE" | tee out/V6.1.1-BG-OHLCV-source.txt
          BUILD_TOOLS="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)"
          "$BUILD_TOOLS/aapt" dump badging out/V6.1.1-BG-OHLCV-debug.apk | tee out/V6.1.1-BG-OHLCV-badging.txt
          "$BUILD_TOOLS/apksigner" verify --verbose --print-certs out/V6.1.1-BG-OHLCV-debug.apk | tee out/V6.1.1-BG-OHLCV-signature.txt
          grep -q "package: name='tr.borsatakip.v5' versionCode='611' versionName='6.1.1'" out/V6.1.1-BG-OHLCV-badging.txt
          unzip -p out/V6.1.1-BG-OHLCV-debug.apk classes.dex | strings | grep -Fq 'borsa-takip-backend-live-production.up.railway.app'

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: V6.1.1-BG-OHLCV-APK
          path: out/*
          if-no-files-found: error
          retention-days: 30
