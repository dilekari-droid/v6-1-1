name: V6.1.1 R4 Android Source Probe

on:
  push:
    branches: [r4-sync-stage]
    paths:
      - '.ci/v611-source/**'
      - '.github/workflows/r4-android-source-probe.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-android-r4:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact commit
        uses: actions/checkout@v4
      - name: Reconstruct Android source payload
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t parts < <(find .ci/v611-source -maxdepth 1 -type f -name 'part*.b64' | sort -V)
          test "${#parts[@]}" -gt 0
          cat "${parts[@]}" | tr -d '\r\n' | base64 --decode > /tmp/android-source.tar.xz
          xz --test /tmp/android-source.tar.xz
          rm -rf /tmp/v611-android && mkdir -p /tmp/v611-android
          tar -xJf /tmp/android-source.tar.xz -C /tmp/v611-android
          ANDROID_DIR="$(find /tmp/v611-android -type f -name settings.gradle.kts -printf '%h\n' | head -1)"
          test -n "$ANDROID_DIR"
          echo "ANDROID_DIR=$ANDROID_DIR" >> "$GITHUB_ENV"
      - name: Verify R4 progress policy and identity
        shell: bash
        run: |
          set -euo pipefail
          test -f "$ANDROID_DIR/app/build.gradle.kts"
          grep -q 'applicationId = "tr.borsatakip.v5"' "$ANDROID_DIR/app/build.gradle.kts"
          grep -q 'versionCode = 556' "$ANDROID_DIR/app/build.gradle.kts"
          grep -q 'versionName = "5.4.16"' "$ANDROID_DIR/app/build.gradle.kts"
          OPPORTUNITY="$ANDROID_DIR/app/src/main/java/tr/borsatakip/v5/ui/OpportunityActivity.kt"
          test -f "$OPPORTUNITY"
          grep -q 'BistScanUiPolicy.progressPercent' "$OPPORTUNITY"
          if grep -qE 'session\.progress([^A-Za-z0-9_]|$)' "$OPPORTUNITY"; then
            echo 'OpportunityActivity still uses raw session.progress' >&2
            exit 1
          fi
          grep -R -q 'openInterest' "$ANDROID_DIR/app/src/main/java/tr/borsatakip/v5"
          grep -R -q 'volume' "$ANDROID_DIR/app/src/main/java/tr/borsatakip/v5"
          echo 'Inherited Android source contains the R4 critical source fixes checked here.'
      - name: Compile Android source
        shell: bash
        run: |
          set -euo pipefail
          cd "$ANDROID_DIR"
          chmod +x gradlew
          ./gradlew --no-daemon testDebugUnitTest compileDebugKotlin compileDebugAndroidTestKotlin
