name: V6.1.1 Unsigned Production Release

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/build-v611-release-unsigned.yml'
      - '.ci/v611-scan-long-short-overlay.b64'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  build-unsigned-release:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      BORSA_EXTERNAL_SIGNING: '1'
      BORSA_BACKEND_URL: 'https://borsa-takip-backend-live-production.up.railway.app'
      BORSA_ATTESTATION_PUBLIC_KEYS: 'borsa-prod:v611-20260925:1:MFkwEwYHKoZIzj0CAQYIKoZIzj0DAQcDQgAEdDJwst8dTdL7v36TIKv+mbc2+br0pkbTdNiUHZMJpeOPUZAKNEGzua5m1Hs0c+KhhjCLt2ZrJ1k5TGtDfFE50g=='
    steps:
      - name: Checkout pipeline repository
        uses: actions/checkout@v4

      - name: Download verified final-closure source artifact
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          curl -fL \
            -H 'Accept: application/vnd.github+json' \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/10848471681/zip" \
            -o /tmp/final-closure-artifact.zip
          mkdir -p /tmp/final-closure
          unzip -q /tmp/final-closure-artifact.zip -d /tmp/final-closure
          echo 'b42ba7cb18bd522ad90987a48e5ecb8d26428e7ee601b8b0d4c7fb18028b79fb  /tmp/final-closure/V6.1.1-FINAL-CLOSURE-SOURCE.zip' | sha256sum -c -
          mkdir -p "$GITHUB_WORKSPACE/release-src"
          unzip -q /tmp/final-closure/V6.1.1-FINAL-CLOSURE-SOURCE.zip -d "$GITHUB_WORKSPACE/release-src"
          test -f "$GITHUB_WORKSPACE/release-src/android/app/build.gradle.kts"

      - name: Apply production release and LONG SHORT source hardening
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p = Path('release-src/android/app/build.gradle.kts')
          s = p.read_text()
          old = '''                check(hasReleaseSigning) { "Release APK üretimi için güvenli imzalama değişkenleri zorunludur." }
                          signingConfig = signingConfigs.getByName("releaseSecure")
          '''
          new = '''                val externalSigning = System.getenv("BORSA_EXTERNAL_SIGNING") == "1"
                          if (externalSigning) {
                              // Public CI may build an unsigned, non-debuggable release candidate.
                              // Private-key signing is performed outside the public repository.
                              signingConfig = null
                          } else {
                              check(hasReleaseSigning) { "Release APK üretimi için güvenli imzalama değişkenleri zorunludur." }
                              signingConfig = signingConfigs.getByName("releaseSecure")
                          }
          '''
          if s.count(old) != 1:
              raise SystemExit(f'external-signing patch count={s.count(old)}')
          p.write_text(s.replace(old, new, 1))
          PY

          base64 -d "$GITHUB_WORKSPACE/.ci/v611-scan-long-short-overlay.b64" > /tmp/v611-scan-long-short-overlay.tar.xz
          echo 'b289dcf6c1f2181f5280d05b1e27d5653384ad9190638a4d065025affa92820f  /tmp/v611-scan-long-short-overlay.tar.xz' | sha256sum -c -
          xz --test /tmp/v611-scan-long-short-overlay.tar.xz
          tar -xJf /tmp/v611-scan-long-short-overlay.tar.xz -C release-src/android

          test -f release-src/android/app/src/main/java/tr/borsatakip/v5/analysis/ScanDirectionPolicy.kt
          test -f release-src/android/app/src/test/java/tr/borsatakip/v5/analysis/ScanDirectionPolicyTest.kt
          grep -Fq 'findViewById<Button>(R.id.scanLong).text = "🟢 LONG"' release-src/android/app/src/main/java/tr/borsatakip/v5/ui/ScanResultsActivity.kt
          grep -Fq 'findViewById<Button>(R.id.scanShort).text = "🔴 SHORT"' release-src/android/app/src/main/java/tr/borsatakip/v5/ui/ScanResultsActivity.kt
          grep -Fq 'ScanDirectionPolicy.classify(item)' release-src/android/app/src/main/java/tr/borsatakip/v5/ui/ScanResultsActivity.kt
          grep -Fq 'ScanDirectionPolicy.classify(it).strength' release-src/android/app/src/main/java/tr/borsatakip/v5/ui/ScanResultSortPolicy.kt
          ! grep -Fq 'findViewById<Button>(R.id.scanLong).visibility = View.GONE' release-src/android/app/src/main/java/tr/borsatakip/v5/ui/ScanResultsActivity.kt
          ! grep -Fq 'findViewById<Button>(R.id.scanShort).visibility = View.GONE' release-src/android/app/src/main/java/tr/borsatakip/v5/ui/ScanResultsActivity.kt
          python - <<'PY'
          from pathlib import Path
          s = Path('release-src/android/app/src/main/res/layout/activity_scan_results.xml').read_text()
          ids = ['scanAll', 'scan85', 'scanScore', 'scanLong', 'scanShort']
          pos = [s.index('@+id/' + x) for x in ids]
          if pos != sorted(pos):
              raise SystemExit(f'filter order invalid: {pos}')
          PY

          mkdir -p release-src/android/tools
          cat > release-src/android/tools/build-release.sh <<'EOF'
          #!/usr/bin/env bash
          set -euo pipefail
          : "${BORSA_ATTESTATION_PUBLIC_KEYS:?BORSA_ATTESTATION_PUBLIC_KEYS gerekli}"
          if [[ "${BORSA_EXTERNAL_SIGNING:-0}" != "1" ]]; then
            : "${BORSA_KEYSTORE_PATH:?BORSA_KEYSTORE_PATH gerekli}"
            : "${BORSA_STORE_PASSWORD:?BORSA_STORE_PASSWORD gerekli}"
            : "${BORSA_KEY_ALIAS:?BORSA_KEY_ALIAS gerekli}"
            : "${BORSA_KEY_PASSWORD:?BORSA_KEY_PASSWORD gerekli}"
          fi
          gradle --no-daemon --stacktrace clean testReleaseUnitTest assembleRelease
          EOF
          chmod +x release-src/android/tools/build-release.sh
          mkdir -p out
          (cd release-src && zip -qr "$GITHUB_WORKSPACE/out/V6.1.1-RELEASE-SOURCE.zip" android -x 'android/.gradle/*' 'android/**/build/*')
          sha256sum out/V6.1.1-RELEASE-SOURCE.zip | tee out/V6.1.1-RELEASE-SOURCE.zip.sha256

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Test and build unsigned release APK
        working-directory: release-src/android
        shell: bash
        run: |
          set -euo pipefail
          gradle --no-daemon --stacktrace testReleaseUnitTest assembleRelease

      - name: Align and verify unsigned release
        shell: bash
        run: |
          set -euo pipefail
          BUILD_TOOLS="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)"
          APK="$(find release-src/android/app/build/outputs/apk/release -type f -name '*.apk' | head -1)"
          test -n "$APK"
          "$BUILD_TOOLS/zipalign" -f -p 4 "$APK" out/V6.1.1-release-unsigned-aligned.apk
          "$BUILD_TOOLS/zipalign" -c -v 4 out/V6.1.1-release-unsigned-aligned.apk > out/V6.1.1-zipalign.txt
          "$BUILD_TOOLS/aapt" dump badging out/V6.1.1-release-unsigned-aligned.apk > out/V6.1.1-release-badging.txt
          grep -q "package: name='tr.borsatakip.v5' versionCode='611' versionName='6.1.1'" out/V6.1.1-release-badging.txt
          if grep -q '^application-debuggable$' out/V6.1.1-release-badging.txt; then
            echo 'release APK is debuggable' >&2
            exit 1
          fi
          if "$BUILD_TOOLS/apksigner" verify out/V6.1.1-release-unsigned-aligned.apk 2>/dev/null; then
            echo 'unexpected pre-signature detected' >&2
            exit 1
          fi
          mkdir -p out/apksigner/lib
          cp "$BUILD_TOOLS/apksigner" out/apksigner/apksigner
          cp "$BUILD_TOOLS/lib/apksigner.jar" out/apksigner/lib/apksigner.jar
          chmod +x out/apksigner/apksigner
          sha256sum out/V6.1.1-release-unsigned-aligned.apk | tee out/V6.1.1-release-unsigned-aligned.apk.sha256
          printf 'UNSIGNED_RELEASE=PASS\nDEBUGGABLE=NO\nPACKAGE=tr.borsatakip.v5\nVERSION_CODE=611\nVERSION_NAME=6.1.1\nSCAN_LONG_SHORT_OVERLAY=PASS\nFILTER_ORDER=TUM|85+T|TEKN|LONG|SHORT\nDIRECTION_SORT=DISPLAY_STRENGTH_DESC\n' > out/V6.1.1-unsigned-release-verification.txt

      - name: Upload unsigned release package
        uses: actions/upload-artifact@v4
        with:
          name: V6.1.1-UNSIGNED-RELEASE-PACKAGE
          if-no-files-found: error
          retention-days: 30
          path: |
            out/V6.1.1-release-unsigned-aligned.apk
            out/V6.1.1-release-unsigned-aligned.apk.sha256
            out/V6.1.1-release-badging.txt
            out/V6.1.1-zipalign.txt
            out/V6.1.1-unsigned-release-verification.txt
            out/V6.1.1-RELEASE-SOURCE.zip
            out/V6.1.1-RELEASE-SOURCE.zip.sha256
            out/apksigner/apksigner
            out/apksigner/lib/apksigner.jar
