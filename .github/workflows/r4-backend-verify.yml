name: V6.1.1 R4 Source Verify

on:
  push:
    branches: [ r4-sync-stage ]
    paths:
      - '.ci/v611-r4-source/source.tar.xz'
      - '.ci/v611-r4-source/PROVENANCE.txt'
      - '.github/workflows/r4-backend-verify.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-r4-source:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact commit
        uses: actions/checkout@v4

      - name: Verify and extract exact R4 source
        shell: bash
        run: |
          set -euo pipefail
          test -f .ci/v611-r4-source/source.tar.xz
          echo '3531eea3df6f35b2231889978c9de5f2907a5e57534eb456a9654c67354f0aef  .ci/v611-r4-source/source.tar.xz' | sha256sum -c -
          xz --test .ci/v611-r4-source/source.tar.xz
          mkdir -p /tmp/v611-r4
          tar -xJf .ci/v611-r4-source/source.tar.xz -C /tmp/v611-r4
          test -f /tmp/v611-r4/backend/main.py
          test -f /tmp/v611-r4/backend/requirements-dev.txt
          test -d /tmp/v611-r4/android
          test -d /tmp/v611-r4/contracts
          test -f /tmp/v611-r4/scripts/preapk-source-gate.sh

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install source-test dependencies
        shell: bash
        run: python -m pip install --disable-pip-version-check -r /tmp/v611-r4/backend/requirements-dev.txt

      - name: Run complete pre-APK source gate
        shell: bash
        working-directory: /tmp/v611-r4
        run: bash scripts/preapk-source-gate.sh

      - name: Assert no APK or AAB was produced
        shell: bash
        working-directory: /tmp/v611-r4
        run: |
          set -euo pipefail
          if find . -type f \( -name '*.apk' -o -name '*.aab' \) -print -quit | grep -q .; then
            echo 'Unexpected APK/AAB generated by source verification' >&2
            exit 1
          fi
          echo 'R4_SOURCE_VERIFY_PASS'
