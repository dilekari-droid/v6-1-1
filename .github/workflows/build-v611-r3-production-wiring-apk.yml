name: V6.1.1 R3 Production Wiring APK

on:
  push:
    branches: [ v611-r3-apk-build-20260927 ]
    paths:
      - '.ci/v611-r3-from-r4-android.patch.xz.b64'
      - '.github/workflows/build-v611-r3-production-wiring-apk.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  build-r3-apks:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      BORSA_EXTERNAL_SIGNING: '1'
      BORSA_BACKEND_URL: 'https://borsa-takip-backend-live-production.up.railway.app'
      BORSA_ATTESTATION_PUBLIC_KEYS: 'borsa-prod:v611-20260925:1:MFkwEwYHKoZIzj0CAQYIKoZIzj0DAQcDQgAEdDJwst8dTdL7v36TIKv+mbc2+br0pkbTdNiUHZMJpeOPUZAKNEGzua5m1Hs0c+KhhjCLt2ZrJ1k5TGtDfFE50g=='
      R4_ARTIFACT_ID: '10924204160'
      R4_SOURCE_SHA256: 'd64cc395aea6fbdb076e845c6b87db745aef08ddc5e4d40f87f2850e774ce77b'
      R3_PATCH_XZ_SHA256: '22ba9b224be29b0d7751c8afabc0d5b15774d8b11c7f4b58bc1f21d99500c8c4'
      R3_ANDROID_TREE_SHA256: '12ed5f20f3d2a2219c19dc02f16f9028f093e1028df4b2b8af86b2256fdebaf2'

    steps:
      - name: Checkout build branch
        uses: actions/checkout@v4

      - name: Download verified complete-source R4 artifact
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          curl -fL \
            -H 'Accept: application/vnd.github+json' \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${R4_ARTIFACT_ID}/zip" \
            -o /tmp/r4-artifact.zip
          mkdir -p /tmp/r4-artifact
          unzip -q /tmp/r4-artifact.zip -d /tmp/r4-artifact
          test -f /tmp/r4-artifact/V6.1.1-COMPLETE-SOURCE-R4.zip
          echo "${R4_SOURCE_SHA256}  /tmp/r4-artifact/V6.1.1-COMPLETE-SOURCE-R4.zip" | sha256sum -c -
          mkdir -p release-src
          unzip -q /tmp/r4-artifact/V6.1.1-COMPLETE-SOURCE-R4.zip -d release-src
          test -f release-src/android/app/build.gradle.kts
          echo 'R4_SOURCE_PROVENANCE=PASS'

      - name: Apply exact R4 to R3 Android overlay
        shell: bash
        run: |
          set -euo pipefail
          base64 -d .ci/v611-r3-from-r4-android.patch.xz.b64 > /tmp/r3.patch.xz
          echo "${R3_PATCH_XZ_SHA256}  /tmp/r3.patch.xz" | sha256sum -c -
          xz -t /tmp/r3.patch.xz
          xz -dc /tmp/r3.patch.xz > /tmp/r3.patch
          patch --batch --forward -p2 -d release-src/android < /tmp/r3.patch
          echo 'R3_OVERLAY_APPLIED=PASS'

      - name: Verify exact R3 Android source tree
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import hashlib, os
          root=Path('release-src/android')
          items=[]
          for p in sorted(x for x in root.rglob('*') if x.is_file()):
              rel=p.relative_to(root).as_posix()
              if rel.startswith('.gradle/') or '/build/' in f'/{rel}/':
                  continue
              h=hashlib.sha256(p.read_bytes()).hexdigest()
              items.append(f'{h}  {rel}')
          manifest='\n'.join(items)+'\n'
          digest=hashlib.sha256(manifest.encode()).hexdigest()
          expected=os.environ['R3_ANDROID_TREE_SHA256']
          print(f'R3_ANDROID_FILE_COUNT={len(items)}')
          print(f'R3_ANDROID_TREE_SHA256={digest}')
          if len(items) != 362:
              raise SystemExit(f'Unexpected R3 Android file count: {len(items)}')
          if digest != expected:
              raise SystemExit(f'R3 Android tree mismatch: {digest} != {expected}')
          Path('R3-ANDROID-MANIFEST.txt').write_text(manifest)
          print('R3_ANDROID_EXACT_TREE=PASS')
          PY
          grep -Fq 'object BistUniverseCompletenessPolicy' release-src/android/app/src/main/java/tr/borsatakip/v5/data/BistUniverseCompletenessPolicy.kt
          grep -Fq 'BistUniverseCompletenessPolicy.validate' release-src/android/app/src/main/java/tr/borsatakip/v5/data/MobileMarketDataProvider.kt

      - name: Correct stale test fixture only
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p=Path('release-src/android/app/src/test/java/tr/borsatakip/v5/ui/ProviderCapabilityPresentationPolicyTest.kt')
          s=p.read_text()
          old='''                contractsReady = true, metadataReady = true,\n                quoteReady = true, historyReady = false'''
          new='''                contractsReady = true, metadataReady = true,\n                activeFutureReady = true, quoteReady = true, historyReady = false'''
          if s.count(old) != 1:
              raise SystemExit('Expected stale fixture pattern exactly once')
          p.write_text(s.replace(old,new))
          print('TEST_ONLY_FIXTURE_CORRECTION=PASS')
          PY
          git -C release-src/android diff --no-index /dev/null /dev/null >/dev/null 2>&1 || true
          grep -Fq 'activeFutureReady = true, quoteReady = true, historyReady = false' release-src/android/app/src/test/java/tr/borsatakip/v5/ui/ProviderCapabilityPresentationPolicyTest.kt
          echo 'PRODUCTION_SOURCE_UNCHANGED=PASS'

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Test and build exact R3 APKs
        working-directory: release-src/android
        shell: bash
        run: |
          set -euo pipefail
          gradle --no-daemon --stacktrace testReleaseUnitTest assembleDebug assembleRelease

      - name: Verify and package APKs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out
          BUILD_TOOLS="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)"
          DEBUG_APK="$(find release-src/android/app/build/outputs/apk/debug -type f -name '*.apk' | head -1)"
          RELEASE_APK="$(find release-src/android/app/build/outputs/apk/release -type f -name '*.apk' | head -1)"
          test -n "$DEBUG_APK" && test -n "$RELEASE_APK"

          cp "$DEBUG_APK" out/V6.1.1-R3-PRODUCTION-WIRING-DEBUG.apk
          "$BUILD_TOOLS/zipalign" -f -p 4 "$RELEASE_APK" out/V6.1.1-R3-PRODUCTION-WIRING-RELEASE-UNSIGNED.apk
          "$BUILD_TOOLS/zipalign" -c -v 4 out/V6.1.1-R3-PRODUCTION-WIRING-RELEASE-UNSIGNED.apk > out/release-zipalign.txt

          "$BUILD_TOOLS/aapt" dump badging out/V6.1.1-R3-PRODUCTION-WIRING-DEBUG.apk > out/debug-badging.txt
          "$BUILD_TOOLS/aapt" dump badging out/V6.1.1-R3-PRODUCTION-WIRING-RELEASE-UNSIGNED.apk > out/release-badging.txt
          grep -q "package: name='tr.borsatakip.v5' versionCode='611' versionName='6.1.1'" out/debug-badging.txt
          grep -q "package: name='tr.borsatakip.v5' versionCode='611' versionName='6.1.1'" out/release-badging.txt
          grep -q '^application-debuggable$' out/debug-badging.txt
          if grep -q '^application-debuggable$' out/release-badging.txt; then
            echo 'ERROR: release is debuggable' >&2; exit 1
          fi

          "$BUILD_TOOLS/apksigner" verify --verbose --print-certs out/V6.1.1-R3-PRODUCTION-WIRING-DEBUG.apk > out/debug-signature.txt
          if "$BUILD_TOOLS/apksigner" verify out/V6.1.1-R3-PRODUCTION-WIRING-RELEASE-UNSIGNED.apk >/dev/null 2>&1; then
            echo 'ERROR: release candidate unexpectedly signed' >&2; exit 1
          fi

          cp R3-ANDROID-MANIFEST.txt out/R3-ANDROID-MANIFEST.txt
          cp .ci/v611-r3-from-r4-android.patch.xz.b64 out/R3-OVERLAY.patch.xz.b64
          if [ -f release-src/android/app/build/outputs/mapping/release/mapping.txt ]; then
            cp release-src/android/app/build/outputs/mapping/release/mapping.txt out/mapping.txt
          fi
          sha256sum \
            out/V6.1.1-R3-PRODUCTION-WIRING-DEBUG.apk \
            out/V6.1.1-R3-PRODUCTION-WIRING-RELEASE-UNSIGNED.apk \
            out/R3-ANDROID-MANIFEST.txt > out/SHA256SUMS.txt
          cat > out/BUILD-VERIFICATION.txt <<EOF
          SOURCE=V6.1.1 R3 Production Wiring
          BASE_R4_ARTIFACT=${R4_ARTIFACT_ID}
          BASE_R4_SOURCE_SHA256=${R4_SOURCE_SHA256}
          R3_PATCH_XZ_SHA256=${R3_PATCH_XZ_SHA256}
          R3_ANDROID_TREE_SHA256=${R3_ANDROID_TREE_SHA256}
          TEST_FIXTURE_CORRECTION=TEST_ONLY_ACTIVE_FUTURE_READY_TRUE
          PRODUCTION_SOURCE_RUNTIME_CHANGE=NO
          PACKAGE=tr.borsatakip.v5
          VERSION=6.1.1/611
          RELEASE_DEBUGGABLE=NO
          DEBUG_APK=DEBUG_SIGNED_INSTALLABLE
          RELEASE_APK=UNSIGNED_NON_DEBUGGABLE
          RELEASE_PRIVATE_SIGNING=NOT_AVAILABLE_IN_PUBLIC_CI
          TEST_RELEASE_UNIT=PASS
          EOF

      - name: Upload exact R3 APK package
        uses: actions/upload-artifact@v4
        with:
          name: V6.1.1-R3-PRODUCTION-WIRING-APK-PACKAGE
          if-no-files-found: error
          retention-days: 30
          path: |
            out/V6.1.1-R3-PRODUCTION-WIRING-DEBUG.apk
            out/V6.1.1-R3-PRODUCTION-WIRING-RELEASE-UNSIGNED.apk
            out/debug-badging.txt
            out/release-badging.txt
            out/debug-signature.txt
            out/release-zipalign.txt
            out/R3-ANDROID-MANIFEST.txt
            out/R3-OVERLAY.patch.xz.b64
            out/SHA256SUMS.txt
            out/BUILD-VERIFICATION.txt
            out/mapping.txt
