name: V6.1.1 R4 Materialize Base

on:
  push:
    branches: [ r4-sync-stage ]
    paths:
      - '.github/workflows/r4-materialize-base.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout stage repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Checkout pinned main payload source
        uses: actions/checkout@v4
        with:
          repository: dilekari-droid/v6-1-1
          ref: ce71dc7b13f74365dc7d55f62643f58fe2675568
          path: main-head

      - name: Checkout pinned V5 Android base
        uses: actions/checkout@v4
        with:
          repository: dilekari-droid/v5.1.1
          ref: 28c18f669970f5a7621e89b80179c63c94b6f7aa
          path: base-v5

      - name: Reconstruct exact R4 backend
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/r4-materialized/backend-payload
          mapfile -t parts < <(find .ci/v611-backend-r4 -maxdepth 1 -type f -name 'part*.b64' | sort -V)
          test "${#parts[@]}" -eq 10
          cat "${parts[@]}" | tr -d '\r\n' | base64 --decode > /tmp/backend.tar.xz
          echo 'a8272efc8853e500d3a83578fa6658da1a10157ae865eca7a6342c82eae98e61  /tmp/backend.tar.xz' | sha256sum -c -
          xz --test /tmp/backend.tar.xz
          tar -xJf /tmp/backend.tar.xz -C /tmp/r4-materialized/backend-payload
          test "$(find /tmp/r4-materialized/backend-payload/backend -type f | wc -l)" -eq 20

      - name: Reconstruct verified R3 Android base
        shell: bash
        run: |
          set -euo pipefail
          ROOT='main-head/.ci/v611-overlay-r3'
          PARTS=(
            part00.b64 part01.b64 part02.b64 part03.b64 part04.b64
            part05a.b64 part05b.b64 part06a.b64 part06b.b64
            part07a.b64 part07b.b64 part08a.b64 part08b.b64 part09.b64
          )
          : > /tmp/v611-overlay.b64
          for part in "${PARTS[@]}"; do test -s "$ROOT/$part"; cat "$ROOT/$part" >> /tmp/v611-overlay.b64; done
          test "$(wc -c < /tmp/v611-overlay.b64)" -eq 73804
          base64 -d /tmp/v611-overlay.b64 > /tmp/v611-overlay.tar.xz
          echo '29989105d1adb64dcd6fb4a514f803adebfd693b07fe3ddbfe775127751e04fc  /tmp/v611-overlay.tar.xz' | sha256sum -c -
          xz --test /tmp/v611-overlay.tar.xz
          ANDROID_DIR="$GITHUB_WORKSPACE/base-v5/android"
          tar -xJf /tmp/v611-overlay.tar.xz -C "$ANDROID_DIR"
          test -f "$ANDROID_DIR/DELETE-LIST.txt"
          while IFS= read -r rel; do test -n "$rel" || continue; rm -f -- "$ANDROID_DIR/$rel"; done < "$ANDROID_DIR/DELETE-LIST.txt"
          rm -f "$ANDROID_DIR/DELETE-LIST.txt"
          mkdir -p /tmp/r4-materialized/android
          cp -a "$ANDROID_DIR/." /tmp/r4-materialized/android/
          test "$(find /tmp/r4-materialized/android -type f | wc -l)" -eq 327

      - name: Commit materialized base to work branch
        shell: bash
        run: |
          set -euo pipefail
          rm -rf main-head base-v5
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -a /tmp/r4-materialized/android ./android
          cp -a /tmp/r4-materialized/backend-payload/backend ./backend
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git switch -C r4-materialized
          git add -A
          test "$(git ls-files | wc -l)" -eq 347
          git commit -m 'source: materialize verified Android base and exact R4 backend'
          git push --force origin HEAD:refs/heads/r4-materialized
