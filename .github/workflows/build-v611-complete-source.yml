name: Build V6.1.1 Complete Source

on:
  push:
    branches: [ v611-complete-source ]
    paths:
      - '.github/workflows/build-v611-complete-source.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  build-complete-source:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Download verified Android source base
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/v611-base
          gh run download 36240927867 -R "${GITHUB_REPOSITORY}" -n V6.1.1-VIOP-INDEPENDENT-PREFLIGHT-PACKAGE -D /tmp/v611-base
          BASE_SOURCE=$(find /tmp/v611-base -type f -name 'V6.1.1-VIOP-INDEPENDENT-PREFLIGHT-SOURCE.zip' -print -quit)
          test -n "$BASE_SOURCE"
          mkdir -p complete_source
          unzip -q "$BASE_SOURCE" -d complete_source
          test -x complete_source/android/gradlew
          test -f complete_source/android/app/build.gradle.kts

      - name: Overlay canonical backend source
        shell: bash
        run: |
          set -euo pipefail
          rm -rf complete_source/backend_v611
          cp -a backend_v611 complete_source/backend_v611
          mkdir -p complete_source/ci
          cp .github/workflows/sync-v611-complete-source.yml complete_source/ci/
          cp .github/workflows/build-v611-complete-source.yml complete_source/ci/
          cat > complete_source/.env.example <<'EOF'
          # Application/backend authentication key. Keep secret in deployment environment.
          BORSA_API_KEY=
          APP_API_KEY=

          # TradeWize production configuration. Do not put secrets in the APK.
          TRADEWIZE_API_KEY=
          TRADEWIZE_OAUTH_URL=
          TRADEWIZE_UNIVERSE_URL=
          TRADEWIZE_QUOTE_URL_TEMPLATE=
          TRADEWIZE_HISTORY_URL_TEMPLATE=
          TRADEWIZE_MIN_INTERVAL_MS=1000

          # Gateway wiring.
          VIOP_SIDECAR_URL=
          LEGACY_BACKEND_URL=
          EOF
          cat > complete_source/SOURCE_STATUS.md <<'EOF'
          # V6.1.1 Complete Source Status

          Canonical source combines the verified V6.1.1 Android independent-preflight/reconnect source with the tested R3 VIOP backend, policy, production gateway and regression tests.

          Included source guarantees fail-closed behavior for missing or invalid provider prerequisites. It does not invent provider endpoints, metadata, credentials, or history schemas.

          External production dependencies still required for real TradeWize E2E: valid TRADEWIZE_API_KEY plus authoritative OAuth, universe/metadata, quote and history endpoint contracts. These values are deployment configuration and are intentionally not embedded in this source package or APK.
          EOF

      - name: Backend regression suite
        shell: bash
        run: |
          set -euo pipefail
          cd complete_source
          node --check backend_v611/viop_r3_policy.mjs
          node --check backend_v611/viop_sidecar_r3.mjs
          node --check backend_v611/production_gateway_r3.mjs
          for t in backend_v611/tests/test_*.py; do echo "RUN $t"; PYTHONPATH=. python "$t"; done
          node backend_v611/tests/test_viop_r3_policy_fixed.mjs
          node backend_v611/tests/test_production_gateway_r3.mjs

      - name: Android unit test and debug build
        shell: bash
        run: |
          set -euo pipefail
          cd complete_source/android
          chmod +x gradlew
          ./gradlew --no-daemon testReleaseUnitTest assembleDebug
          test -f app/build/outputs/apk/debug/app-debug.apk

      - name: Package canonical source
        shell: bash
        run: |
          set -euo pipefail
          rm -rf complete_source/android/.gradle complete_source/android/.kotlin complete_source/android/app/build complete_source/android/build
          mkdir -p output
          cp complete_source/android/app/build/outputs/apk/debug/app-debug.apk output/V6.1.1-COMPLETE-SOURCE-DEBUG.apk 2>/dev/null || true
          # Rebuild the APK after cleaning build dirs only if the copy above was unavailable.
          if [ ! -f output/V6.1.1-COMPLETE-SOURCE-DEBUG.apk ]; then
            cd complete_source/android
            ./gradlew --no-daemon assembleDebug
            cd ../..
            cp complete_source/android/app/build/outputs/apk/debug/app-debug.apk output/V6.1.1-COMPLETE-SOURCE-DEBUG.apk
            rm -rf complete_source/android/.gradle complete_source/android/.kotlin complete_source/android/app/build complete_source/android/build
          fi
          (cd complete_source && zip -qr ../output/V6.1.1-COMPLETE-SOURCE.zip .)
          cat > output/V6.1.1-COMPLETE-SOURCE-REPORT.md <<EOF
          # V6.1.1 Complete Source Build

          - Branch: ${GITHUB_REF_NAME}
          - Commit: ${GITHUB_SHA}
          - Android verified base run: 36240927867
          - Backend readiness regressions: PASS
          - TradeWize quota regressions: PASS
          - VIOP contract parser regressions: PASS
          - R3 policy regression: PASS
          - R3 production gateway runtime: PASS
          - Android testReleaseUnitTest: PASS
          - Android assembleDebug: PASS
          - Real TradeWize production E2E: NOT_RUN / BLOCKED by external credential + authoritative endpoint contract
          - Production release signing: NOT_RUN / external release key required
          EOF
          (cd output && sha256sum V6.1.1-COMPLETE-SOURCE.zip V6.1.1-COMPLETE-SOURCE-DEBUG.apk > SHA256SUMS.txt)

      - name: Upload complete package
        uses: actions/upload-artifact@v4
        with:
          name: V6.1.1-COMPLETE-SOURCE-PACKAGE
          path: output/*
          retention-days: 30
