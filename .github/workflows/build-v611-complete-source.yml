name: Build V6.1.1 Complete Source

on:
  push:
    branches: [ v611-complete-source ]
    paths:
      - 'android/**'
      - 'backend_v611/**'
      - '.env.example'
      - 'SOURCE_STATUS.md'
      - '.github/workflows/build-v611-complete-source.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-complete-source:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      BORSA_BACKEND_URL: 'https://borsa-takip-backend-live-production.up.railway.app'
      BORSA_ATTESTATION_PUBLIC_KEYS: 'borsa-prod:v611-20260925:1:MFkwEwYHKoZIzj0CAQYIKoZIzj0DAQcDQgAEdDJwst8dTdL7v36TIKv+mbc2+br0pkbTdNiUHZMJpeOPUZAKNEGzua5m1Hs0c+KhhjCLt2ZrJ1k5TGtDfFE50g=='
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Assemble self-contained source tree
        shell: bash
        run: |
          set -euo pipefail
          test -x android/gradlew
          test -f android/app/build.gradle.kts
          test -f backend_v611/viop_r3_policy.mjs
          test -f backend_v611/viop_sidecar_r3.mjs
          test -f backend_v611/production_gateway_r3.mjs
          rm -rf complete_source
          mkdir -p complete_source/ci
          cp -a android complete_source/android
          cp -a backend_v611 complete_source/backend_v611
          cp .env.example complete_source/.env.example
          cp SOURCE_STATUS.md complete_source/SOURCE_STATUS.md
          cp .github/workflows/sync-v611-complete-source.yml complete_source/ci/
          cp .github/workflows/materialize-v611-complete-source.yml complete_source/ci/
          cp .github/workflows/build-v611-complete-source.yml complete_source/ci/
          rm -rf complete_source/android/.gradle complete_source/android/.kotlin complete_source/android/app/build complete_source/android/build
          echo 'V611_SELF_CONTAINED_SOURCE=PASS'

      - name: Verify application identity and source safety
        shell: bash
        run: |
          set -euo pipefail
          F=complete_source/android/app/build.gradle.kts
          grep -q 'namespace = "tr.borsatakip.v5"' "$F"
          grep -q 'applicationId = "tr.borsatakip.v5"' "$F"
          grep -q 'versionCode = 611' "$F"
          grep -q 'versionName = "6.1.1"' "$F"
          python - <<'PY'
          from pathlib import Path
          import re
          root=Path('complete_source')
          checks={
              'actual_btk_token': re.compile(r'btk_[A-Za-z0-9_-]{20,}'),
              'private_key_pem': re.compile(r'-----BEGIN (?:EC |RSA |OPENSSH )?PRIVATE KEY-----'),
          }
          for name,rx in checks.items():
              hits=[]
              for p in root.rglob('*'):
                  if not p.is_file():
                      continue
                  try: text=p.read_text(errors='ignore')
                  except Exception: continue
                  if rx.search(text): hits.append(str(p))
              if hits:
                  raise SystemExit(f'{name}=FAIL files={len(hits)}')
              print(f'{name}=PASS')
          PY
          echo 'V611_APPLICATION_IDENTITY=PASS'

      - name: Backend regression suite
        shell: bash
        run: |
          set -euo pipefail
          cd complete_source
          node --check backend_v611/viop_r3_policy.mjs
          node --check backend_v611/viop_sidecar_r3.mjs
          node --check backend_v611/production_gateway_r3.mjs
          for t in backend_v611/tests/test_*.py; do echo "RUN $t"; PYTHONPATH=. python "$t"; done
          node backend_v611/tests/test_viop_r3_policy_fixed.mjs
          node backend_v611/tests/test_production_gateway_r3.mjs

      - name: Android unit test and debug build
        shell: bash
        env:
          BORSA_EXTERNAL_SIGNING: '1'
        run: |
          set -euo pipefail
          cd complete_source/android
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace testReleaseUnitTest assembleDebug
          test -f app/build/outputs/apk/debug/app-debug.apk

      - name: Verify debug APK
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p output
          APK=complete_source/android/app/build/outputs/apk/debug/app-debug.apk
          BUILD_TOOLS="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)"
          test -x "$BUILD_TOOLS/apksigner"
          test -x "$BUILD_TOOLS/aapt"
          "$BUILD_TOOLS/apksigner" verify --verbose --print-certs "$APK" > output/debug-signature.txt
          "$BUILD_TOOLS/aapt" dump badging "$APK" > output/debug-badging.txt
          grep -q "package: name='tr.borsatakip.v5' versionCode='611' versionName='6.1.1'" output/debug-badging.txt
          grep -q "sdkVersion:'26'" output/debug-badging.txt
          grep -q "targetSdkVersion:'35'" output/debug-badging.txt
          echo 'V611_DEBUG_APK_SIGNATURE=PASS'
          echo 'V611_DEBUG_APK_IDENTITY=PASS'

      - name: Package canonical source
        shell: bash
        run: |
          set -euo pipefail
          cp complete_source/android/app/build/outputs/apk/debug/app-debug.apk output/V6.1.1-COMPLETE-SOURCE-DEBUG.apk
          rm -rf complete_source/android/.gradle complete_source/android/.kotlin complete_source/android/app/build complete_source/android/build complete_source/backend_v611/__pycache__ complete_source/backend_v611/tests/__pycache__
          (cd complete_source && zip -qr ../output/V6.1.1-COMPLETE-SOURCE.zip .)
          cat > output/V6.1.1-COMPLETE-SOURCE-REPORT.md <<EOF
          # V6.1.1 Complete Source Build

          - Branch: ${GITHUB_REF_NAME}
          - Commit: ${GITHUB_SHA}
          - Self-contained Android + backend source: PASS
          - Package: tr.borsatakip.v5
          - versionName: 6.1.1
          - versionCode: 611
          - minSdk: 26
          - targetSdk: 35
          - Hardcoded btk token scan: PASS
          - Private-key PEM scan: PASS
          - Backend readiness regressions: PASS
          - TradeWize quota regressions: PASS
          - VIOP contract parser regressions: PASS
          - R3 policy regression: PASS
          - R3 production gateway runtime: PASS
          - Android testReleaseUnitTest: PASS
          - Android assembleDebug: PASS
          - Debug APK identity/signature verification: PASS
          - Real TradeWize production E2E: NOT_RUN / BLOCKED by external credential + authoritative endpoint contract
          - Production release signing: NOT_RUN / external release key required
          EOF
          (cd output && sha256sum V6.1.1-COMPLETE-SOURCE.zip V6.1.1-COMPLETE-SOURCE-DEBUG.apk > SHA256SUMS.txt)

      - name: Upload complete package
        uses: actions/upload-artifact@v4
        with:
          name: V6.1.1-COMPLETE-SOURCE-PACKAGE
          if-no-files-found: error
          path: output/*
          retention-days: 30
