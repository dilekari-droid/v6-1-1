name: V6.1.1 VIOP Liquidity Closure Release

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/build-v611-viop-liquidity-release.yml'
      - '.ci/v611-viop-liquidity-overlay.b64'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  build-viop-liquidity-closure:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      BORSA_EXTERNAL_SIGNING: '1'
      BORSA_BACKEND_URL: 'https://borsa-takip-backend-live-production.up.railway.app'
      BORSA_ATTESTATION_PUBLIC_KEYS: 'borsa-prod:v611-20260925:1:MFkwEwYHKoZIzj0CAQYIKoZIzj0DAQcDQgAEdDJwst8dTdL7v36TIKv+mbc2+br0pkbTdNiUHZMJpeOPUZAKNEGzua5m1Hs0c+KhhjCLt2ZrJ1k5TGtDfFE50g=='

    steps:
      - name: Checkout pipeline repository
        uses: actions/checkout@v4

      - name: Download verified HOME-DIRECTION-SORT source
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          curl -fL \
            -H 'Accept: application/vnd.github+json' \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            'https://api.github.com/repos/dilekari-droid/v6-1-1/actions/artifacts/10859607455/zip' \
            -o /tmp/base-artifact.zip
          mkdir -p /tmp/base-artifact
          unzip -q /tmp/base-artifact.zip -d /tmp/base-artifact
          echo '82330e45956a9772a191aa0b4f000b520b2f8618162400ecdfdd46f768953df9  /tmp/base-artifact/V6.1.1-HOME-DIRECTION-SORT-SOURCE.zip' | sha256sum -c -
          mkdir -p release-src
          unzip -q /tmp/base-artifact/V6.1.1-HOME-DIRECTION-SORT-SOURCE.zip -d release-src
          test -f release-src/android/app/src/main/java/tr/borsatakip/v5/analysis/ViopScanner.kt
          test -f release-src/android/app/src/main/java/tr/borsatakip/v5/analysis/TodayOpportunitySortPolicy.kt

      - name: Apply isolated VIOP liquidity and OI closure
        shell: bash
        run: |
          set -euo pipefail
          base64 -d .ci/v611-viop-liquidity-overlay.b64 > /tmp/viop-overlay.tar.xz
          echo '--- VIOP OVERLAY CONTENTS ---'
          tar -tJf /tmp/viop-overlay.tar.xz
          rm -rf /tmp/viop-overlay && mkdir -p /tmp/viop-overlay
          tar -xJf /tmp/viop-overlay.tar.xz -C /tmp/viop-overlay
          if [ -d /tmp/viop-overlay/android ]; then
            rsync -a /tmp/viop-overlay/android/ release-src/android/
          elif [ -d /tmp/viop-overlay/release-src/android ]; then
            rsync -a /tmp/viop-overlay/release-src/android/ release-src/android/
          elif [ -d /tmp/viop-overlay/app ]; then
            rsync -a /tmp/viop-overlay/app/ release-src/android/app/
          else
            echo 'Unknown VIOP overlay root:' >&2
            find /tmp/viop-overlay -maxdepth 6 -type f -print >&2
            exit 1
          fi
          POLICY='release-src/android/app/src/main/java/tr/borsatakip/v5/analysis/ViopLiquidityInputPolicy.kt'
          TEST='release-src/android/app/src/test/java/tr/borsatakip/v5/analysis/ViopLiquidityInputPolicyTest.kt'
          SCANNER='release-src/android/app/src/main/java/tr/borsatakip/v5/analysis/ViopScanner.kt'
          test -f "$POLICY"
          test -f "$TEST"
          grep -Fq 'ViopLiquidityInputPolicy' "$SCANNER"
          grep -Fq 'openInterest' "$POLICY"
          grep -Fq 'volume' "$POLICY"
          echo 'VIOP_LIQUIDITY_OVERLAY=PASS'

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Test and build unsigned release APK
        working-directory: release-src/android
        shell: bash
        run: |
          set -euo pipefail
          gradle --no-daemon --stacktrace testReleaseUnitTest assembleRelease

      - name: Package and verify release
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out
          BUILD_TOOLS="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)"
          APK="$(find release-src/android/app/build/outputs/apk/release -type f -name '*.apk' | head -1)"
          test -n "$APK"
          "$BUILD_TOOLS/zipalign" -f -p 4 "$APK" out/V6.1.1-viop-liquidity-unsigned-aligned.apk
          "$BUILD_TOOLS/zipalign" -c -v 4 out/V6.1.1-viop-liquidity-unsigned-aligned.apk > out/zipalign.txt
          "$BUILD_TOOLS/aapt" dump badging out/V6.1.1-viop-liquidity-unsigned-aligned.apk > out/badging.txt
          grep -q "package: name='tr.borsatakip.v5' versionCode='611' versionName='6.1.1'" out/badging.txt
          if grep -q '^application-debuggable$' out/badging.txt; then echo 'release APK is debuggable' >&2; exit 1; fi
          if "$BUILD_TOOLS/apksigner" verify out/V6.1.1-viop-liquidity-unsigned-aligned.apk 2>/dev/null; then echo 'unexpected pre-signature detected' >&2; exit 1; fi
          (cd release-src && zip -qr "$GITHUB_WORKSPACE/out/V6.1.1-VIOP-LIQUIDITY-SOURCE.zip" android -x 'android/.gradle/*' 'android/**/build/*')
          sha256sum out/V6.1.1-viop-liquidity-unsigned-aligned.apk out/V6.1.1-VIOP-LIQUIDITY-SOURCE.zip > out/SHA256SUMS.txt
          mkdir -p out/apksigner/lib
          cp "$BUILD_TOOLS/apksigner" out/apksigner/apksigner
          cp "$BUILD_TOOLS/lib/apksigner.jar" out/apksigner/lib/apksigner.jar
          chmod +x out/apksigner/apksigner
          printf 'VIOP_LIQUIDITY_CLOSURE=PASS\nOI_FABRICATION=NO\nVOLUME_FALLBACK=VERIFIED_CLOSED_OHLCV_ONLY\nPACKAGE=tr.borsatakip.v5\nVERSION=6.1.1/611\nDEBUGGABLE=NO\n' > out/VERIFICATION.txt

      - name: Upload VIOP closure package
        uses: actions/upload-artifact@v4
        with:
          name: V6.1.1-VIOP-LIQUIDITY-CLOSURE-UNSIGNED-PACKAGE
          if-no-files-found: error
          retention-days: 30
          path: |
            out/V6.1.1-viop-liquidity-unsigned-aligned.apk
            out/V6.1.1-VIOP-LIQUIDITY-SOURCE.zip
            out/badging.txt
            out/zipalign.txt
            out/SHA256SUMS.txt
            out/VERIFICATION.txt
            out/apksigner/apksigner
            out/apksigner/lib/apksigner.jar