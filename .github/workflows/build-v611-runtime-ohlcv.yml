name: V6.1.1 Runtime OHLCV Verified APK Build

on:
  push:
    branches: [ main ]
    paths:
      - '.ci/v611-runtime-ohlcv-v611/**'
      - '.ci/v611-runtime-network-resilience.py'
      - '.ci/v611-external-market-v2/**'
      - '.ci/v611-uiux-v6-fixes.py'
      - '.ci/v611-uiux-v6-copy-fixes.py'
      - '.ci/v611-uiux-v6-favorites-failclosed.py'
      - '.ci/v611-uiux-v6-state-failclosed.py'
      - '.ci/v611-overlay-r3/**'
      - '.github/workflows/build-v611-runtime-ohlcv.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-test-build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout V6.1.1 payload repository
        uses: actions/checkout@v4

      - name: Checkout pinned V5 Android base
        uses: actions/checkout@v4
        with:
          repository: dilekari-droid/v5.1.1
          ref: 28c18f669970f5a7621e89b80179c63c94b6f7aa
          path: base-v5

      - name: Reconstruct and verify V6.1.1 R3 overlay
        shell: bash
        run: |
          set -euo pipefail
          ROOT='.ci/v611-overlay-r3'
          PARTS=(
            part00.b64 part01.b64 part02.b64 part03.b64 part04.b64
            part05a.b64 part05b.b64 part06a.b64 part06b.b64
            part07a.b64 part07b.b64 part08a.b64 part08b.b64 part09.b64
          )
          : > /tmp/v611-overlay.b64
          for part in "${PARTS[@]}"; do test -s "$ROOT/$part"; cat "$ROOT/$part" >> /tmp/v611-overlay.b64; done
          test "$(wc -c < /tmp/v611-overlay.b64)" -eq 73804
          base64 -d /tmp/v611-overlay.b64 > /tmp/v611-overlay.tar.xz
          echo '29989105d1adb64dcd6fb4a514f803adebfd693b07fe3ddbfe775127751e04fc  /tmp/v611-overlay.tar.xz' | sha256sum -c -
          xz --test /tmp/v611-overlay.tar.xz

      - name: Apply R3 and proven UIUX fix chain
        shell: bash
        run: |
          set -euo pipefail
          ANDROID_DIR="$GITHUB_WORKSPACE/base-v5/android"
          tar -xJf /tmp/v611-overlay.tar.xz -C "$ANDROID_DIR"
          test -f "$ANDROID_DIR/DELETE-LIST.txt"
          while IFS= read -r rel; do test -n "$rel" || continue; rm -f -- "$ANDROID_DIR/$rel"; done < "$ANDROID_DIR/DELETE-LIST.txt"
          rm -f "$ANDROID_DIR/DELETE-LIST.txt"

          grep -q 'applicationId = "tr.borsatakip.v5"' "$ANDROID_DIR/app/build.gradle.kts"
          grep -q 'versionCode = 556' "$ANDROID_DIR/app/build.gradle.kts"
          grep -q 'versionName = "5.4.16"' "$ANDROID_DIR/app/build.gradle.kts"

          python "$GITHUB_WORKSPACE/.ci/v611-uiux-v6-fixes.py" "$ANDROID_DIR"
          python "$GITHUB_WORKSPACE/.ci/v611-uiux-v6-copy-fixes.py" "$ANDROID_DIR"
          python "$GITHUB_WORKSPACE/.ci/v611-uiux-v6-favorites-failclosed.py" "$ANDROID_DIR"
          python "$GITHUB_WORKSPACE/.ci/v611-uiux-v6-state-failclosed.py" "$ANDROID_DIR"

          SRC="$ANDROID_DIR/app/src/main/java/tr/borsatakip/v5"
          grep -Fq 'showUnavailableSummary("Veri bekleniyor")' "$SRC/ui/ViopActivity.kt"
          grep -Fq 'marketSummaryReady' "$SRC/ui/StocksActivity.kt"
          grep -Fq 'Sinyal doğrulanmadı • AL/SAT gösterilmiyor' "$SRC/ui/FavoriteAdapter.kt"
          grep -Fq 'TEKNİK İZLEME • AL/SAT YOK' "$SRC/ui/TechnicalAnalysisActivity.kt"
          grep -Fq 'Bağlantı veya veri servisi şu anda kullanılamıyor.' "$SRC/ui/NotificationsActivity.kt"

          echo "ANDROID_DIR=$ANDROID_DIR" >> "$GITHUB_ENV"

      - name: Reconstruct and apply runtime OHLCV overlay
        shell: bash
        run: |
          set -euo pipefail
          ROOT='.ci/v611-runtime-ohlcv-v611'
          : > /tmp/v611-runtime-ohlcv.b64
          for n in 00 01 02 03 04 05 06 07 08 09; do
            part="$ROOT/part${n}.b64"
            test -s "$part"
            cat "$part" >> /tmp/v611-runtime-ohlcv.b64
          done
          test "$(wc -c < /tmp/v611-runtime-ohlcv.b64)" -eq 58080
          base64 -d /tmp/v611-runtime-ohlcv.b64 > /tmp/v611-runtime-ohlcv.tar.xz
          echo '464da8f9c532fdd58e23df939e7fed0119b71908bdd8a2f073c0563164f56b06  /tmp/v611-runtime-ohlcv.tar.xz' | sha256sum -c -
          xz --test /tmp/v611-runtime-ohlcv.tar.xz
          tar -xJf /tmp/v611-runtime-ohlcv.tar.xz -C "$ANDROID_DIR"

          # Runtime StockDetail carries the new OHLCV diagnostics. Re-apply the two
          # proven fail-closed UI rules that are intentionally layered after it.
          python - <<'PY'
          from pathlib import Path
          import os
          p = Path(os.environ['ANDROID_DIR']) / 'app/src/main/java/tr/borsatakip/v5/ui/StockDetailActivity.kt'
          s = p.read_text()
          old = '''                chartStatus.text = "${timeframe.label}: gerçek OHLCV verisi alınamadı • ${error.message ?: error.javaClass.simpleName}"
                          trendInfoPanel.text = "Trend analizi için yeterli veri yok."'''
          new = '''                android.util.Log.w("StockDetailActivity", "Chart load failed for ${timeframe.label}", error)
                          chartStatus.text = "${timeframe.label}: gerçek OHLCV verisi alınamadı. Veri sağlayıcı durumunu kontrol edin."
                          trendInfoPanel.text = "Trend analizi için yeterli veri yok."'''
          if s.count(old) != 1:
              raise SystemExit(f'StockDetail runtime error-copy pattern count={s.count(old)}')
          s = s.replace(old, new, 1)
          old2 = '    private fun money(v:Double)=if(v.isFinite())"%.2f TL".format(v) else "Veri yok"'
          new2 = '    private fun money(v:Double)=if(v.isFinite() && v > 0.0)"%.2f TL".format(v) else "Veri yok"'
          if s.count(old2) != 1:
              raise SystemExit(f'StockDetail money gate pattern count={s.count(old2)}')
          p.write_text(s.replace(old2, new2, 1))
          PY

          python "$GITHUB_WORKSPACE/.ci/v611-runtime-network-resilience.py" "$ANDROID_DIR"

          # Apply verified external-market V2 source patch (readable text; no opaque payload).
          EXT_V2_ROOT="$GITHUB_WORKSPACE/.ci/v611-external-market-v2"
          EXT_V2_PATCH=/tmp/v611-external-market-v2.patch
          : > "$EXT_V2_PATCH"
          for n in 00 01 02 03 04; do
            part="$EXT_V2_ROOT/part${n}.patch"
            test -s "$part"
            cat "$part" >> "$EXT_V2_PATCH"
          done
          test "$(wc -c < "$EXT_V2_PATCH")" -eq 50237
          echo 'aeb8ae7309e206a9b9b8d4ad5deb0a399b8497d234a0886ba5bc1c7905e118f7  /tmp/v611-external-market-v2.patch' | sha256sum -c -
          (cd "$ANDROID_DIR" && patch --dry-run -p1 < "$EXT_V2_PATCH")
          (cd "$ANDROID_DIR" && patch -p1 < "$EXT_V2_PATCH")

          # strings.xml is minified; apply the four visible filter-label changes exactly.
          python - <<'PY'
          from pathlib import Path
          import os
          p = Path(os.environ['ANDROID_DIR']) / 'app/src/main/res/values/strings.xml'
          s = p.read_text()
          replacements = {
              '>LONG<': '>↗ LONG<',
              '>SHORT<': '>↘ SHORT<',
              '>85+ GÜÇLÜ<': '>85+ TEKNİK<',
              '>SKORA GÖRE<': '>TEKNİK PUAN<',
          }
          for old, new in replacements.items():
              count = s.count(old)
              if count != 1:
                  raise SystemExit(f'filter string pattern count={count} pattern={old}')
              s = s.replace(old, new, 1)
          p.write_text(s)
          PY

          SRC="$ANDROID_DIR/app/src/main/java/tr/borsatakip/v5"
          TESTSRC="$ANDROID_DIR/app/src/test/java/tr/borsatakip/v5"
          STRINGS="$ANDROID_DIR/app/src/main/res/values/strings.xml"
          FILTER_LAYOUT="$ANDROID_DIR/app/src/main/res/layout/activity_scan_results.xml"

          grep -q 'applicationId = "tr.borsatakip.v5"' "$ANDROID_DIR/app/build.gradle.kts"
          grep -q 'versionCode = 611' "$ANDROID_DIR/app/build.gradle.kts"
          grep -q 'versionName = "6.1.1"' "$ANDROID_DIR/app/build.gradle.kts"
          grep -Fq 'https://borsa-takip-backend-live-production.up.railway.app' "$ANDROID_DIR/app/build.gradle.kts"
          grep -Fq 'BORSA_ATTESTATION_PUBLIC_KEYS' "$ANDROID_DIR/app/build.gradle.kts"
          grep -Fq '<string name="app_name">V6.1.1</string>' "$STRINGS"
          ! grep -R -E 'btk_[A-Za-z0-9]{20,}' "$ANDROID_DIR/app/src" "$ANDROID_DIR/app/build.gradle.kts"

          test -f "$SRC/data/ScanRuntimeLog.kt"
          test -f "$SRC/worker/ScanScreenStateMonitor.kt"
          grep -Fq 'SCAN_SCREEN_LOCKED' "$SRC/worker/ScanScreenStateMonitor.kt"
          grep -Fq 'SCAN_SCREEN_UNLOCKED' "$SRC/worker/ScanScreenStateMonitor.kt"
          grep -Fq 'START_REDELIVER_INTENT' "$SRC/worker/BistScanForegroundService.kt"
          grep -Fq 'awaitValidatedNetworkIfNeeded()' "$SRC/worker/BistScanForegroundService.kt"
          grep -Fq 'onCapabilitiesChanged' "$SRC/worker/BistScanForegroundService.kt"
          grep -Fq 'network_recovered_before_scan' "$SRC/worker/BistScanForegroundService.kt"
          test "$(git hash-object "$SRC/worker/BistScanForegroundService.kt")" = '2e6064ddc54f1034af912fb75a6c5cb3d35dc39e'
          grep -Fq 'ManualScanPauseGate.awaitIfPaused()' "$SRC/data/MobileMarketDataProvider.kt"
          grep -Fq 'ProviderFailureCode.NETWORK_TIMEOUT, ProviderFailureCode.DNS_ERROR' "$SRC/data/MobileMarketDataProvider.kt"
          test "$(git hash-object "$SRC/data/MobileMarketDataProvider.kt")" = '12dbf58ddb373c0b10051d0c9190ea31ff86a13a'
          grep -Fq 'Hisse taraması devam ediyor' "$SRC/worker/AutoScanForegroundService.kt"
          grep -Fq 'SCAN_CYCLE_COMPLETED' "$SRC/worker/AutoScanForegroundService.kt"
          grep -Fq 'LONG_DETECTED' "$SRC/worker/AutomaticScanRunner.kt"
          grep -Fq 'SHORT_DETECTED' "$SRC/worker/AutomaticScanRunner.kt"

          grep -Fq 'THIRTY_MIN("30 DK"' "$SRC/analysis/ChartTimeframe.kt"
          grep -Fq 'FOUR_HOUR("4 SA"' "$SRC/analysis/ChartTimeframe.kt"
          grep -Fq 'showEma21' "$SRC/ui/PriceChartView.kt"
          grep -Fq 'OHLCV_FLOW' "$SRC/ui/StockDetailActivity.kt"
          grep -Fq 'ChartHistoryFailureReason.INSUFFICIENT_CANDLES' "$SRC/ui/StockDetailActivity.kt"
          grep -Fq 'rawQuery' "$SRC/data/BackendPreflightClient.kt"
          test -f "$TESTSRC/analysis/ChartTimeframeContractTest.kt"
          test -f "$TESTSRC/ui/ScanResultSortPolicyTest.kt"
          test "$(git hash-object "$SRC/ui/StockDetailActivity.kt")" = '47dd618ef68212248b7028330ce1c9dc297f8e28'

          grep -Fq 'ScanResultSortPolicy.directional' "$SRC/ui/ScanResultsActivity.kt"
          grep -Fq 'LONG SİNYALİ BULUNAMADI' "$SRC/ui/ScanResultsActivity.kt"
          grep -Fq 'SHORT SİNYALİ BULUNAMADI' "$SRC/ui/ScanResultsActivity.kt"
          grep -Fq 'android:weightSum="5"' "$FILTER_LAYOUT"
          grep -Fq 'android:autoSizeMinTextSize="7sp"' "$FILTER_LAYOUT"
          grep -Fq 'Mode.LONG -> R.color.green' "$SRC/ui/ScanResultsActivity.kt"
          grep -Fq 'Mode.SHORT -> R.color.red' "$SRC/ui/ScanResultsActivity.kt"
          grep -Fq 'button.backgroundTintList = ColorStateList.valueOf' "$SRC/ui/ScanResultsActivity.kt"
          SCAN_RESULTS_SHA="$(git hash-object "$SRC/ui/ScanResultsActivity.kt")"
          FILTER_LAYOUT_SHA="$(git hash-object "$FILTER_LAYOUT")"
          echo "SCAN_RESULTS_SHA actual=$SCAN_RESULTS_SHA expected=04f1d8ad65a77c16666ba0d967f3ecd11e054380"
          echo "FILTER_LAYOUT_SHA actual=$FILTER_LAYOUT_SHA expected=1c6e0c2e342a074136e7918baf8de2ffa173c45b"
          test "$SCAN_RESULTS_SHA" = '04f1d8ad65a77c16666ba0d967f3ecd11e054380'
          test "$FILTER_LAYOUT_SHA" = '1c6e0c2e342a074136e7918baf8de2ffa173c45b'

          # External-market V2 fail-closed/fallback/cache source gates.
          EXT_SHA_FAIL=0
          ext_sha_check() {
            local path="$1" expected="$2" actual
            actual="$(git hash-object "$path")"
            echo "EXT_V2_SHA_CHECK path=$path actual=$actual expected=$expected"
            if [ "$actual" != "$expected" ]; then EXT_SHA_FAIL=1; fi
          }
          ext_sha_check "$SRC/data/ExternalMarketQuoteLog.kt" 'aa9b1e65ab2d0cbb07c6f7201d0ebfb4cbda46b2'
          ext_sha_check "$SRC/data/ExternalMarketQuotePolicy.kt" '3f2a7550652e8ce78917f7ee4674550028910b83'
          ext_sha_check "$SRC/data/ExternalMarketQuoteService.kt" '87c29851c1cc6e21a6942a92672272ff8b3154cd'
          ext_sha_check "$SRC/data/YahooFallbackProvider.kt" '9c5f9a4a6ea57d7c3dfb81b898426c753f7a829b'
          ext_sha_check "$SRC/ui/MainActivity.kt" 'f57d10607b06d2d62d5c807050750da0f33fb937'
          ext_sha_check "$SRC/ui/MarketInstrumentDetailActivity.kt" '7d0e45d3196df78f0997ecb941a3830bc2e5a218'
          ext_sha_check "$SRC/ui/SettingsDetailActivity.kt" '150dfe18c85163a1238c2b5cb7860585e5aee334'
          ext_sha_check "$SRC/ui/ViopActivity.kt" '274c16abf7fa1feb80d2e734c0b1e95558754c2d'
          ext_sha_check "$FILTER_LAYOUT" '1c6e0c2e342a074136e7918baf8de2ffa173c45b'
          ext_sha_check "$STRINGS" 'aede467ab21340779ad1086cc6d1e6b580692248'
          ext_sha_check "$TESTSRC/data/ExternalMarketQuotePolicyTest.kt" 'c744fed261a5d421177d56356bee0d53985061fd'
          test "$EXT_SHA_FAIL" -eq 0

          grep -Fq 'class ExternalMarketQuoteService' "$SRC/data/ExternalMarketQuoteService.kt"
          grep -Fq 'StageState' "$SRC/data/ExternalMarketQuoteService.kt"
          grep -Fq 'SourceKind' "$SRC/data/ExternalMarketQuoteService.kt"
          grep -Fq 'MEMO_TTL_MS = 15_000L' "$SRC/data/ExternalMarketQuoteService.kt"
          grep -Fq 'CAPABILITY_MEMO_TTL_MS = 15_000L' "$SRC/data/ExternalMarketQuoteService.kt"
          grep -Fq 'fallbackMaster.isChecked' "$SRC/ui/SettingsDetailActivity.kt"
          grep -Fq 'yahooFallback.isChecked' "$SRC/ui/SettingsDetailActivity.kt"
          grep -Fq 'forceRefresh = true' "$SRC/ui/MarketInstrumentDetailActivity.kt"
          grep -Fq 'SON BAŞARILI VERİ' "$SRC/ui/MarketInstrumentDetailActivity.kt"
          grep -Fq 'Birincil sağlayıcı' "$SRC/ui/MarketInstrumentDetailActivity.kt"
          grep -Fq 'Yedek sağlayıcı' "$SRC/ui/MarketInstrumentDetailActivity.kt"
          grep -Fq 'ExternalMarketQuoteService(this)' "$SRC/ui/MainActivity.kt"
          grep -Fq 'ExternalMarketQuoteService(this@ViopActivity)' "$SRC/ui/ViopActivity.kt"
          grep -Fq 'TRY=X' "$SRC/ui/ViopActivity.kt"
          grep -Fq 'XAUUSD=X' "$SRC/ui/ViopActivity.kt"
          grep -Fq 'GC=F' "$SRC/ui/ViopActivity.kt"
          ! grep -Fq 'Doğrulanmış kaynak yok' "$SRC/ui/ViopActivity.kt"
          grep -Fq '↗ LONG' "$STRINGS"
          grep -Fq '↘ SHORT' "$STRINGS"
          grep -Fq '85+ TEKNİK' "$STRINGS"
          grep -Fq 'TEKNİK PUAN' "$STRINGS"

          echo 'SELECTED_SOURCE=v5.1.1@28c18f669970f5a7621e89b80179c63c94b6f7aa + verified V6.1.1 R3 overlay + proven UIUX-V6 chain + runtime/OHLCV overlay 464da8f9 + network resilience 4d07a4c9 + external market V2 textual patch aeb8ae73' >> "$GITHUB_ENV"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Run Android unit tests
        working-directory: ${{ env.ANDROID_DIR }}
        run: gradle --no-daemon --stacktrace testDebugUnitTest

      - name: Build debug APK
        working-directory: ${{ env.ANDROID_DIR }}
        run: gradle --no-daemon --stacktrace assembleDebug

      - name: Locate and verify APK
        shell: bash
        run: |
          set -euo pipefail
          APK="$(find "$ANDROID_DIR/app/build/outputs/apk/debug" -type f -name '*.apk' | head -1)"
          test -n "$APK"
          mkdir -p out
          cp "$APK" out/V6.1.1-RUNTIME-OHLCV-EXTMARKET-V2-debug.apk
          sha256sum out/V6.1.1-RUNTIME-OHLCV-EXTMARKET-V2-debug.apk | tee out/V6.1.1-RUNTIME-OHLCV-EXTMARKET-V2-debug.apk.sha256
          printf 'source=%s\n' "$SELECTED_SOURCE" | tee out/V6.1.1-RUNTIME-OHLCV-EXTMARKET-V2-source.txt
          BUILD_TOOLS="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)"
          "$BUILD_TOOLS/aapt" dump badging out/V6.1.1-RUNTIME-OHLCV-EXTMARKET-V2-debug.apk | tee out/V6.1.1-RUNTIME-OHLCV-EXTMARKET-V2-badging.txt
          "$BUILD_TOOLS/apksigner" verify --verbose --print-certs out/V6.1.1-RUNTIME-OHLCV-EXTMARKET-V2-debug.apk | tee out/V6.1.1-RUNTIME-OHLCV-EXTMARKET-V2-signature.txt
          grep -q "package: name='tr.borsatakip.v5' versionCode='611' versionName='6.1.1'" out/V6.1.1-RUNTIME-OHLCV-EXTMARKET-V2-badging.txt

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: V6.1.1-RUNTIME-OHLCV-EXTMARKET-V2-APK
          path: out/*
          if-no-files-found: error
          retention-days: 30
