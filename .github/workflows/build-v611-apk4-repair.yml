name: V6.1.1 APK4 Repair Build

on:
  push:
    branches: [ v611-final14-runtime-fix ]
    paths:
      - '.ci/v611-apk4-repair.patch.xz.b64'
      - '.github/workflows/build-v611-apk4-repair.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  verify-test-build:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    env:
      BORSA_BACKEND_URL: 'https://borsa-takip-backend-live-production.up.railway.app'
      BORSA_ATTESTATION_PUBLIC_KEYS: 'borsa-prod:v611-20260925:1:MFkwEwYHKoZIzj0CAQYIKoZIzj0DAQcDQgAEdDJwst8dTdL7v36TIKv+mbc2+br0pkbTdNiUHZMJpeOPUZAKNEGzua5m1Hs0c+KhhjCLt2ZrJ1k5TGtDfFE50g=='
      RELEASE_KEYSTORE_B64: ${{ secrets.BORSA_KEYSTORE_B64 }}
      RELEASE_STORE_PASSWORD: ${{ secrets.BORSA_STORE_PASSWORD }}
      RELEASE_KEY_ALIAS: ${{ secrets.BORSA_KEY_ALIAS }}
      RELEASE_KEY_PASSWORD: ${{ secrets.BORSA_KEY_PASSWORD }}

    steps:
      - name: Checkout pipeline branch
        uses: actions/checkout@v4

      - name: Download verified previous V6.1.1 source
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          curl -fL \
            -H 'Accept: application/vnd.github+json' \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            'https://api.github.com/repos/dilekari-droid/v6-1-1/actions/artifacts/10877575822/zip' \
            -o /tmp/base-package.zip
          mkdir -p /tmp/base-package release-src
          unzip -q /tmp/base-package.zip -d /tmp/base-package
          echo '2277477ccb02029ce96839d0bb4d34b1c30a4331fa093b4df8c1cba6900eca4f  /tmp/base-package/V6.1.1-VIOP-READINESS-SCAN-FIX-SOURCE.zip' | sha256sum -c -
          unzip -q /tmp/base-package/V6.1.1-VIOP-READINESS-SCAN-FIX-SOURCE.zip -d release-src
          rm -rf release-src/android/.gradle release-src/android/app/build release-src/android/build

      - name: Apply verified FINAL14 patch
        shell: bash
        run: |
          set -euo pipefail
          base64 -d .ci/v611-final14-runtime-fix.patch.xz.b64 > /tmp/final14.patch.xz
          echo 'bd5db3f3773aa0f1cf8c5545c821e84be74f203f275d72b70846e6d117d19109  /tmp/final14.patch.xz' | sha256sum -c -
          xz -dc /tmp/final14.patch.xz > /tmp/final14.patch
          (cd release-src && patch --dry-run -p1 < /tmp/final14.patch)
          (cd release-src && patch -p1 < /tmp/final14.patch)

      - name: Apply verified APK4 repair patch
        shell: bash
        run: |
          set -euo pipefail
          base64 -d .ci/v611-apk4-repair.patch.xz.b64 > /tmp/apk4.patch.xz
          echo '0e17a0ec3b43630cbe1a90103382209d3a2a2f9c62c3c9154076b093a7c99894  /tmp/apk4.patch.xz' | sha256sum -c -
          xz -dc /tmp/apk4.patch.xz > /tmp/apk4.patch
          (cd release-src && patch --dry-run -p1 < /tmp/apk4.patch)
          (cd release-src && patch -p1 < /tmp/apk4.patch)
          python - <<'PY'
          from pathlib import Path
          checks = {
              'VIOP_CONTRACTS_STATE': ('release-src/android/app/src/main/java/tr/borsatakip/v5/ui/ViopContractsActivity.kt','localViopConfigState'),
              'VIOP_DETAIL_STATE': ('release-src/android/app/src/main/java/tr/borsatakip/v5/ui/ViopDetailActivity.kt','localViopConfigState'),
              'OI_SINGLE_RESOLUTION': ('release-src/android/app/src/main/java/tr/borsatakip/v5/analysis/ViopScanner.kt','liquidityInputs.openInterestAvailable'),
              'ACTIVE_FUTURE_READY': ('release-src/android/app/src/main/java/tr/borsatakip/v5/data/MarketCapabilityClient.kt','activeFutureReady'),
              'GLOBAL_CORE_READY': ('release-src/android/app/src/main/java/tr/borsatakip/v5/data/MarketCapabilityClient.kt','globalProviderReady'),
              'HOME_CANONICAL_DIRECTION': ('release-src/android/app/src/main/java/tr/borsatakip/v5/analysis/HomeOpportunityFeedPolicy.kt','canonicalDirection(item)'),
              'TECH_ANALYSIS_TABS': ('release-src/android/app/src/main/java/tr/borsatakip/v5/ui/TechnicalAnalysisActivity.kt','techTabIndicators'),
          }
          for name,(path,needle) in checks.items():
              assert needle in Path(path).read_text(), (name,path,needle)
              print(f'{name}=PASS')
          PY

      - name: Run backend regression suite
        working-directory: release-src
        shell: bash
        run: |
          set -euo pipefail
          export PYTHONPATH=.
          python backend_v611/tests/test_provider_readiness.py
          python backend_v611/tests/test_trade_wize_quota.py
          python backend_v611/tests/test_trade_wize_response_policy.py
          python backend_v611/tests/test_trade_wize_http_adapter.py
          python backend_v611/tests/test_viop_contract_parser.py
          python -m py_compile backend_v611/*.py

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Run Android release unit tests
        working-directory: release-src/android
        shell: bash
        env:
          BORSA_EXTERNAL_SIGNING: '1'
        run: gradle --no-daemon --stacktrace testReleaseUnitTest

      - name: Build release and debug APKs
        working-directory: release-src/android
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "${RELEASE_KEYSTORE_B64:-}" ] && [ -n "${RELEASE_STORE_PASSWORD:-}" ] && [ -n "${RELEASE_KEY_ALIAS:-}" ] && [ -n "${RELEASE_KEY_PASSWORD:-}" ]; then
            printf '%s' "$RELEASE_KEYSTORE_B64" | base64 -d > /tmp/v611-release.keystore
            export BORSA_KEYSTORE_PATH=/tmp/v611-release.keystore
            export BORSA_STORE_PASSWORD="$RELEASE_STORE_PASSWORD"
            export BORSA_KEY_ALIAS="$RELEASE_KEY_ALIAS"
            export BORSA_KEY_PASSWORD="$RELEASE_KEY_PASSWORD"
            unset BORSA_EXTERNAL_SIGNING
            gradle --no-daemon --stacktrace assembleRelease
            echo 'RELEASE_SIGNING=CI_SECRET' >> "$GITHUB_ENV"
          else
            export BORSA_EXTERNAL_SIGNING=1
            gradle --no-daemon --stacktrace assembleRelease
            echo 'RELEASE_SIGNING=UNAVAILABLE' >> "$GITHUB_ENV"
          fi
          gradle --no-daemon --stacktrace assembleDebug

      - name: Package and verify APKs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out
          BUILD_TOOLS="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)"
          RELEASE_APK="$(find release-src/android/app/build/outputs/apk/release -type f -name '*.apk' | head -1)"
          DEBUG_APK="$(find release-src/android/app/build/outputs/apk/debug -type f -name '*.apk' | head -1)"
          test -n "$RELEASE_APK" && test -n "$DEBUG_APK"
          cp "$DEBUG_APK" out/V6.1.1-APK4-REPAIRED-DEBUG.apk
          "$BUILD_TOOLS/apksigner" verify --verbose --print-certs out/V6.1.1-APK4-REPAIRED-DEBUG.apk > out/debug-signature.txt
          "$BUILD_TOOLS/aapt" dump badging out/V6.1.1-APK4-REPAIRED-DEBUG.apk > out/debug-badging.txt
          grep -q "package: name='tr.borsatakip.v5' versionCode='611' versionName='6.1.1'" out/debug-badging.txt
          if "$BUILD_TOOLS/apksigner" verify --verbose --print-certs "$RELEASE_APK" > out/release-signature.txt 2>&1; then
            cp "$RELEASE_APK" out/V6.1.1-APK4-REPAIRED-RELEASE.apk
            echo 'RELEASE_SIGNATURE=PASS' >> out/VERIFICATION.txt
          else
            "$BUILD_TOOLS/zipalign" -f -p 4 "$RELEASE_APK" out/V6.1.1-APK4-REPAIRED-UNSIGNED-ALIGNED.apk
            echo 'RELEASE_SIGNATURE=BLOCKED_NO_RELEASE_KEY' >> out/VERIFICATION.txt
          fi
          printf 'ANDROID_UNIT_TESTS=PASS\nBACKEND_REGRESSIONS=PASS\nDEBUG_SIGNATURE=PASS\nPACKAGE=tr.borsatakip.v5\nVERSION=6.1.1/611\nRELEASE_SIGNING=%s\nPHYSICAL_DEVICE=NOT_RUN\nPLAY_PROTECT_FINAL=NOT_RUN\n' "$RELEASE_SIGNING" >> out/VERIFICATION.txt
          rm -rf release-src/android/.gradle release-src/android/app/build release-src/android/build release-src/backend_v611/__pycache__ release-src/backend_v611/tests/__pycache__ release-src/.pytest_cache
          (cd release-src && zip -qr "$GITHUB_WORKSPACE/out/V6.1.1-APK4-SOURCE.zip" android backend_v611 -x 'android/.gradle/*' 'android/**/build/*' 'backend_v611/**/__pycache__/*' '.pytest_cache/*')
          cp /tmp/apk4.patch out/V6.1.1-APK4-REPAIR.patch
          sha256sum out/*.apk out/*.zip out/*.patch > out/SHA256SUMS.txt

      - name: Upload APK4 repaired package
        uses: actions/upload-artifact@v4
        with:
          name: V6.1.1-APK4-REPAIRED-PACKAGE
          if-no-files-found: error
          retention-days: 30
          path: out/*
