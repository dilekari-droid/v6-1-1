name: V6.1.1 Provider Readiness UI Release

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/build-v611-provider-readiness-ui-release.yml'
      - '.ci/v611-provider-readiness-ui-overlay.b64'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  build-provider-readiness-ui:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      BORSA_EXTERNAL_SIGNING: '1'
      BORSA_BACKEND_URL: 'https://borsa-takip-backend-live-production.up.railway.app'
      BORSA_ATTESTATION_PUBLIC_KEYS: 'borsa-prod:v611-20260925:1:MFkwEwYHKoZIzj0CAQYIKoZIzj0DAQcDQgAEdDJwst8dTdL7v36TIKv+mbc2+br0pkbTdNiUHZMJpeOPUZAKNEGzua5m1Hs0c+KhhjCLt2ZrJ1k5TGtDfFE50g=='

    steps:
      - name: Checkout pipeline repository
        uses: actions/checkout@v4

      - name: Download verified VIOP liquidity source
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          curl -fL \
            -H 'Accept: application/vnd.github+json' \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            'https://api.github.com/repos/dilekari-droid/v6-1-1/actions/artifacts/10861397161/zip' \
            -o /tmp/base-artifact.zip
          mkdir -p /tmp/base-artifact
          unzip -q /tmp/base-artifact.zip -d /tmp/base-artifact
          echo '14c39033dd6d7ca49b400cff8d11d9eff492cfed2b9cd481af8383588e2bb290  /tmp/base-artifact/V6.1.1-VIOP-LIQUIDITY-SOURCE.zip' | sha256sum -c -
          mkdir -p release-src
          unzip -q /tmp/base-artifact/V6.1.1-VIOP-LIQUIDITY-SOURCE.zip -d release-src
          test -f release-src/android/app/src/main/java/tr/borsatakip/v5/analysis/ViopLiquidityInputPolicy.kt
          test -f release-src/android/app/src/main/java/tr/borsatakip/v5/ui/DynamicMarketScanActivity.kt

      - name: Apply provider readiness UI overlay
        shell: bash
        run: |
          set -euo pipefail
          base64 -d .ci/v611-provider-readiness-ui-overlay.b64 > /tmp/provider-ui-overlay.tar.xz
          echo '4f1b539efdcdf9f78634d153a390b936afc9c3d617ca826065e780584a890571  /tmp/provider-ui-overlay.tar.xz' | sha256sum -c -
          echo '--- PROVIDER READINESS UI OVERLAY CONTENTS ---'
          tar -tJf /tmp/provider-ui-overlay.tar.xz
          rm -rf /tmp/provider-ui-overlay && mkdir -p /tmp/provider-ui-overlay
          tar -xJf /tmp/provider-ui-overlay.tar.xz -C /tmp/provider-ui-overlay
          rsync -a /tmp/provider-ui-overlay/android/ release-src/android/

          ACTIVITY='release-src/android/app/src/main/java/tr/borsatakip/v5/ui/DynamicMarketScanActivity.kt'
          POLICY='release-src/android/app/src/main/java/tr/borsatakip/v5/ui/ProviderCapabilityPresentationPolicy.kt'
          TEST='release-src/android/app/src/test/java/tr/borsatakip/v5/ui/ProviderCapabilityPresentationPolicyTest.kt'
          test -f "$ACTIVITY" && test -f "$POLICY" && test -f "$TEST"
          grep -Fq 'ProviderCapabilityPresentationPolicy.globalStatus(snapshot)' "$ACTIVITY"
          grep -Fq 'BIST: FALLBACK / GECİKMELİ' "$POLICY"
          grep -Fq 'VİOP: KULLANILAMIYOR • TradeWize bağlantısı bekleniyor' "$POLICY"
          grep -Fq 'NOT_CONFIGURED' "$POLICY"
          grep -Fq 'ViopLiquidityInputPolicy' release-src/android/app/src/main/java/tr/borsatakip/v5/analysis/ViopScanner.kt
          echo 'PROVIDER_READINESS_UI_OVERLAY=PASS'

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Test and build unsigned release APK
        working-directory: release-src/android
        shell: bash
        run: |
          set -euo pipefail
          gradle --no-daemon --stacktrace testReleaseUnitTest assembleRelease

      - name: Package and verify release
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out
          BUILD_TOOLS="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)"
          APK="$(find release-src/android/app/build/outputs/apk/release -type f -name '*.apk' | head -1)"
          test -n "$APK"
          "$BUILD_TOOLS/zipalign" -f -p 4 "$APK" out/V6.1.1-provider-readiness-ui-unsigned-aligned.apk
          "$BUILD_TOOLS/zipalign" -c -v 4 out/V6.1.1-provider-readiness-ui-unsigned-aligned.apk > out/zipalign.txt
          "$BUILD_TOOLS/aapt" dump badging out/V6.1.1-provider-readiness-ui-unsigned-aligned.apk > out/badging.txt
          grep -q "package: name='tr.borsatakip.v5' versionCode='611' versionName='6.1.1'" out/badging.txt
          if grep -q '^application-debuggable$' out/badging.txt; then echo 'release APK is debuggable' >&2; exit 1; fi
          if "$BUILD_TOOLS/apksigner" verify out/V6.1.1-provider-readiness-ui-unsigned-aligned.apk 2>/dev/null; then echo 'unexpected pre-signature detected' >&2; exit 1; fi
          (cd release-src && zip -qr "$GITHUB_WORKSPACE/out/V6.1.1-PROVIDER-READINESS-UI-SOURCE.zip" android -x 'android/.gradle/*' 'android/**/build/*')
          sha256sum out/V6.1.1-provider-readiness-ui-unsigned-aligned.apk out/V6.1.1-PROVIDER-READINESS-UI-SOURCE.zip > out/SHA256SUMS.txt
          mkdir -p out/apksigner/lib
          cp "$BUILD_TOOLS/apksigner" out/apksigner/apksigner
          cp "$BUILD_TOOLS/lib/apksigner.jar" out/apksigner/lib/apksigner.jar
          chmod +x out/apksigner/apksigner
          printf 'PROVIDER_READINESS_UI=PASS\nBIST_FALLBACK_SEPARATED=YES\nVIOP_NOT_CONFIGURED_FAIL_CLOSED=YES\nPACKAGE=tr.borsatakip.v5\nVERSION=6.1.1/611\nDEBUGGABLE=NO\n' > out/VERIFICATION.txt

      - name: Upload provider readiness UI package
        uses: actions/upload-artifact@v4
        with:
          name: V6.1.1-PROVIDER-READINESS-UI-UNSIGNED-PACKAGE
          if-no-files-found: error
          retention-days: 30
          path: |
            out/V6.1.1-provider-readiness-ui-unsigned-aligned.apk
            out/V6.1.1-PROVIDER-READINESS-UI-SOURCE.zip
            out/badging.txt
            out/zipalign.txt
            out/SHA256SUMS.txt
            out/VERIFICATION.txt
            out/apksigner/apksigner
            out/apksigner/lib/apksigner.jar