name: V6.1.1 VIOP Readiness Scan Fix

on:
  push:
    branches: [ v611-viop-readiness-scan-fix ]
    paths:
      - '.ci/v611-viop-readiness-scan-fix.patch.xz.b64'
      - '.github/workflows/build-v611-viop-readiness-scan-fix.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  verify-test-build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      BORSA_BACKEND_URL: 'https://borsa-takip-backend-live-production.up.railway.app'
      BORSA_ATTESTATION_PUBLIC_KEYS: 'borsa-prod:v611-20260925:1:MFkwEwYHKoZIzj0CAQYIKoZIzj0DAQcDQgAEdDJwst8dTdL7v36TIKv+mbc2+br0pkbTdNiUHZMJpeOPUZAKNEGzua5m1Hs0c+KhhjCLt2ZrJ1k5TGtDfFE50g=='
      RELEASE_KEYSTORE_B64: ${{ secrets.BORSA_KEYSTORE_B64 }}
      RELEASE_STORE_PASSWORD: ${{ secrets.BORSA_STORE_PASSWORD }}
      RELEASE_KEY_ALIAS: ${{ secrets.BORSA_KEY_ALIAS }}
      RELEASE_KEY_PASSWORD: ${{ secrets.BORSA_KEY_PASSWORD }}

    steps:
      - name: Checkout pipeline branch
        uses: actions/checkout@v4

      - name: Download verified previous V6.1.1 source
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          curl -fL \
            -H 'Accept: application/vnd.github+json' \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            'https://api.github.com/repos/dilekari-droid/v6-1-1/actions/artifacts/10873935924/zip' \
            -o /tmp/base-package.zip
          mkdir -p /tmp/base-package release-src
          unzip -q /tmp/base-package.zip -d /tmp/base-package
          echo '10ccaeb8b0e917c30861c8b5382b12b8fdfc0507f26aa9f99230bf975b48abcf  /tmp/base-package/V6.1.1-HOME-OPPORTUNITY-E2E-SOURCE.zip' | sha256sum -c -
          unzip -q /tmp/base-package/V6.1.1-HOME-OPPORTUNITY-E2E-SOURCE.zip -d release-src
          rm -rf release-src/android/.gradle release-src/android/app/build release-src/android/build

      - name: Apply and verify VIOP readiness fix
        shell: bash
        run: |
          set -euo pipefail
          base64 -d .ci/v611-viop-readiness-scan-fix.patch.xz.b64 > /tmp/viop-fix.patch.xz
          echo '7b11b22fb14ecb0fbfcbf4668e95ec3b08af7cbffb4a9856c95ca220252586e1  /tmp/viop-fix.patch.xz' | sha256sum -c -
          xz -dc /tmp/viop-fix.patch.xz > /tmp/viop-fix.patch
          (cd release-src && patch --dry-run -p1 < /tmp/viop-fix.patch)
          (cd release-src && patch -p1 < /tmp/viop-fix.patch)
          python - <<'PY'
          from pathlib import Path
          r = Path('release-src/android/app/src/main/java/tr/borsatakip/v5/data/ProviderReadinessService.kt').read_text()
          a = Path('release-src/android/app/src/main/java/tr/borsatakip/v5/ui/ViopActivity.kt').read_text()
          block = r[r.index('suspend fun testAll()'):r.index('private fun persist(')]
          assert 'val snapshot = if (result.ok)' in block
          assert 'persist(snapshot)' in block
          assert 'return snapshot' in block
          assert 'settings.lastProviderState = ProviderState.PROVIDER_TESTING.name' in block
          assert 'loadDashboardPreview {' in a
          assert 'readiness.localConfigState().state == ProviderState.PROVIDER_READY' in a
          assert 'VİOP TARAMA • %$percent' in a
          print('VIOP_READINESS_PERSISTENCE_GUARD=PASS')
          PY

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Run release unit tests
        working-directory: release-src/android
        shell: bash
        env:
          BORSA_EXTERNAL_SIGNING: '1'
        run: gradle --no-daemon --stacktrace testReleaseUnitTest

      - name: Build release and debug APKs
        working-directory: release-src/android
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "${RELEASE_KEYSTORE_B64:-}" ] && [ -n "${RELEASE_STORE_PASSWORD:-}" ] && [ -n "${RELEASE_KEY_ALIAS:-}" ] && [ -n "${RELEASE_KEY_PASSWORD:-}" ]; then
            printf '%s' "$RELEASE_KEYSTORE_B64" | base64 -d > /tmp/v611-release.keystore
            export BORSA_KEYSTORE_PATH=/tmp/v611-release.keystore
            export BORSA_STORE_PASSWORD="$RELEASE_STORE_PASSWORD"
            export BORSA_KEY_ALIAS="$RELEASE_KEY_ALIAS"
            export BORSA_KEY_PASSWORD="$RELEASE_KEY_PASSWORD"
            unset BORSA_EXTERNAL_SIGNING
            gradle --no-daemon --stacktrace assembleRelease
            echo 'RELEASE_SIGNING=CI_SECRET' >> "$GITHUB_ENV"
          else
            export BORSA_EXTERNAL_SIGNING=1
            gradle --no-daemon --stacktrace assembleRelease
            echo 'RELEASE_SIGNING=UNAVAILABLE' >> "$GITHUB_ENV"
          fi
          gradle --no-daemon --stacktrace assembleDebug

      - name: Package and verify outputs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out
          BUILD_TOOLS="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)"
          RELEASE_APK="$(find release-src/android/app/build/outputs/apk/release -type f -name '*.apk' | head -1)"
          DEBUG_APK="$(find release-src/android/app/build/outputs/apk/debug -type f -name '*.apk' | head -1)"
          test -n "$RELEASE_APK" && test -n "$DEBUG_APK"
          if "$BUILD_TOOLS/apksigner" verify --verbose --print-certs "$RELEASE_APK" > out/release-signature.txt 2>&1; then
            cp "$RELEASE_APK" out/V6.1.1-VIOP-READINESS-SCAN-FIX-RELEASE.apk
            echo 'RELEASE_SIGNATURE=PASS' >> out/VERIFICATION.txt
          else
            "$BUILD_TOOLS/zipalign" -f -p 4 "$RELEASE_APK" out/V6.1.1-VIOP-READINESS-SCAN-FIX-UNSIGNED-ALIGNED.apk
            echo 'RELEASE_SIGNATURE=BLOCKED_NO_RELEASE_KEY' >> out/VERIFICATION.txt
          fi
          cp "$DEBUG_APK" out/V6.1.1-VIOP-READINESS-SCAN-FIX-DEBUG.apk
          "$BUILD_TOOLS/apksigner" verify --verbose --print-certs out/V6.1.1-VIOP-READINESS-SCAN-FIX-DEBUG.apk > out/debug-signature.txt
          "$BUILD_TOOLS/aapt" dump badging out/V6.1.1-VIOP-READINESS-SCAN-FIX-DEBUG.apk > out/debug-badging.txt
          grep -q "package: name='tr.borsatakip.v5' versionCode='611' versionName='6.1.1'" out/debug-badging.txt
          rm -rf release-src/android/.gradle release-src/android/app/build release-src/android/build
          (cd release-src && zip -qr "$GITHUB_WORKSPACE/out/V6.1.1-VIOP-READINESS-SCAN-FIX-SOURCE.zip" android backend_v611 -x 'android/.gradle/*' 'android/**/build/*' 'backend_v611/**/__pycache__/*')
          cp /tmp/viop-fix.patch out/V6.1.1-VIOP-READINESS-SCAN-FIX.patch
          printf 'VIOP_READINESS_PERSISTENCE=PASS\nVIOP_SCAN_START_RACE_FIX=PASS\nVIOP_PROGRESS_PERCENT=PASS\nPACKAGE=tr.borsatakip.v5\nVERSION=6.1.1/611\nRELEASE_SIGNING=%s\nPHYSICAL_DEVICE=NOT_RUN\nLIVE_TRADEWIZE_E2E=NOT_RUN\n' "$RELEASE_SIGNING" >> out/VERIFICATION.txt
          sha256sum out/*.apk out/*.zip out/*.patch > out/SHA256SUMS.txt

      - name: Upload VIOP readiness scan fix package
        uses: actions/upload-artifact@v4
        with:
          name: V6.1.1-VIOP-READINESS-SCAN-FIX-PACKAGE
          if-no-files-found: error
          retention-days: 30
          path: out/*
