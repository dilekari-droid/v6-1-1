name: V6.1.1 Multi Market VIOP Fix

on:
  push:
    branches: [ v611-multi-market-final ]
    paths:
      - '.ci/v611-multi-market-viop-fix.patch.xz.b64'
      - '.github/workflows/build-v611-multi-market-viop-fix.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  verify-test-build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      BORSA_BACKEND_URL: 'https://borsa-takip-backend-live-production.up.railway.app'
      BORSA_ATTESTATION_PUBLIC_KEYS: 'borsa-prod:v611-20260925:1:MFkwEwYHKoZIzj0CAQYIKoZIzj0DAQcDQgAEdDJwst8dTdL7v36TIKv+mbc2+br0pkbTdNiUHZMJpeOPUZAKNEGzua5m1Hs0c+KhhjCLt2ZrJ1k5TGtDfFE50g=='
      RELEASE_KEYSTORE_B64: ${{ secrets.BORSA_KEYSTORE_B64 }}
      RELEASE_STORE_PASSWORD: ${{ secrets.BORSA_STORE_PASSWORD }}
      RELEASE_KEY_ALIAS: ${{ secrets.BORSA_KEY_ALIAS }}
      RELEASE_KEY_PASSWORD: ${{ secrets.BORSA_KEY_PASSWORD }}

    steps:
      - name: Checkout pipeline branch
        uses: actions/checkout@v4

      - name: Download verified V6.1.1 VIOP E2E source
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          curl -fL \
            -H 'Accept: application/vnd.github+json' \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            'https://api.github.com/repos/dilekari-droid/v6-1-1/actions/artifacts/10866314498/zip' \
            -o /tmp/base-artifact.zip
          mkdir -p /tmp/base-artifact release-src
          unzip -q /tmp/base-artifact.zip -d /tmp/base-artifact
          echo 'bbab003da93482b0a818417656ce11a0b7b86424e915618f5ccfea3051c2f12d  /tmp/base-artifact/V6.1.1-VIOP-E2E-HARDENING-SOURCE.zip' | sha256sum -c -
          unzip -q /tmp/base-artifact/V6.1.1-VIOP-E2E-HARDENING-SOURCE.zip -d release-src
          rm -rf release-src/backend_v611/__pycache__ release-src/backend_v611/tests/__pycache__

      - name: Apply and verify HOME filter fix
        shell: bash
        run: |
          set -euo pipefail
          base64 -d .ci/v611-home-opportunity-filter-overlay.b64 > /tmp/home-filter-overlay.tar.xz
          echo '25d83ac32e3fd63edca1d43f90ce7408864be55658ab39e12f3f9966cdb23cd2  /tmp/home-filter-overlay.tar.xz' | sha256sum -c -
          tar -xJf /tmp/home-filter-overlay.tar.xz -C release-src
          echo '4a2de1de0f170d5712c0dca90f61bbe206bcf2529de3c40b7353aeab1ccb280d  release-src/android/app/src/main/java/tr/borsatakip/v5/ui/MainActivity.kt' | sha256sum -c -
          echo 'fbe044895687d751b8b6b57ac423da86e10156b5bd1a46dfd2d471d879b5e2bc  release-src/android/app/src/main/java/tr/borsatakip/v5/analysis/HomeOpportunityFilterPolicy.kt' | sha256sum -c -
          echo '15df45ffb57a76392cf33d6d03ff4cfb481b8431fdbe983b751f16540f438a42  release-src/android/app/src/test/java/tr/borsatakip/v5/analysis/HomeOpportunityFilterPolicyTest.kt' | sha256sum -c -

      - name: Apply multi-market and TradeWize policy fix
        shell: bash
        run: |
          set -euo pipefail
          base64 -d .ci/v611-multi-market-viop-fix.patch.xz.b64 > /tmp/fix.patch.xz
          echo 'f8a0eac00cb932d3e5c58e05ed5fe5d89f4704adf5f69f86d39f4ea5f1427f2f  /tmp/fix.patch.xz' | sha256sum -c -
          xz -dc /tmp/fix.patch.xz > /tmp/fix.patch
          (cd release-src && patch --dry-run -p1 < /tmp/fix.patch)
          (cd release-src && patch -p1 < /tmp/fix.patch)
          ! grep -R -F 'TÜM PİYASALAR engellendi' release-src/android/app/src/main/java/tr/borsatakip/v5/ui/DynamicMarketScanActivity.kt
          ! grep -Fq 'selectedMarket==MarketTab.ALL && !snapshot.multiMarketReady' release-src/android/app/src/main/java/tr/borsatakip/v5/ui/DynamicMarketScanActivity.kt
          test -f release-src/android/app/src/main/java/tr/borsatakip/v5/data/MarketScanReadiness.kt
          test -f release-src/android/app/src/main/java/tr/borsatakip/v5/data/DynamicMarketScanOrchestrator.kt
          test -f release-src/android/app/src/main/java/tr/borsatakip/v5/data/DynamicMarketScanResultRepository.kt
          grep -Fq 'partial = partial || page.partial' release-src/android/app/src/main/java/tr/borsatakip/v5/data/DynamicMarketScannerClient.kt
          echo '4a2de1de0f170d5712c0dca90f61bbe206bcf2529de3c40b7353aeab1ccb280d  release-src/android/app/src/main/java/tr/borsatakip/v5/ui/MainActivity.kt' | sha256sum -c -
          echo 'fbe044895687d751b8b6b57ac423da86e10156b5bd1a46dfd2d471d879b5e2bc  release-src/android/app/src/main/java/tr/borsatakip/v5/analysis/HomeOpportunityFilterPolicy.kt' | sha256sum -c -
          echo '15df45ffb57a76392cf33d6d03ff4cfb481b8431fdbe983b751f16540f438a42  release-src/android/app/src/test/java/tr/borsatakip/v5/analysis/HomeOpportunityFilterPolicyTest.kt' | sha256sum -c -
          echo 'HOME_FILTER_UNCHANGED=PASS'

      - name: Run backend regression tests
        shell: bash
        run: |
          set -euo pipefail
          cd release-src
          export PYTHONPATH="$PWD"
          python backend_v611/tests/test_provider_readiness.py | tee /tmp/backend-readiness.txt
          python backend_v611/tests/test_trade_wize_quota.py | tee /tmp/backend-quota.txt
          python backend_v611/tests/test_trade_wize_response_policy.py | tee /tmp/backend-response-policy.txt
          python backend_v611/tests/test_viop_contract_parser.py | tee /tmp/backend-parser.txt

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Run release unit tests
        working-directory: release-src/android
        shell: bash
        env:
          BORSA_EXTERNAL_SIGNING: '1'
        run: gradle --no-daemon --stacktrace testReleaseUnitTest

      - name: Build release and debug APKs
        working-directory: release-src/android
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "${RELEASE_KEYSTORE_B64:-}" ] && [ -n "${RELEASE_STORE_PASSWORD:-}" ] && [ -n "${RELEASE_KEY_ALIAS:-}" ] && [ -n "${RELEASE_KEY_PASSWORD:-}" ]; then
            printf '%s' "$RELEASE_KEYSTORE_B64" | base64 -d > /tmp/v611-release.keystore
            export BORSA_KEYSTORE_PATH=/tmp/v611-release.keystore
            export BORSA_STORE_PASSWORD="$RELEASE_STORE_PASSWORD"
            export BORSA_KEY_ALIAS="$RELEASE_KEY_ALIAS"
            export BORSA_KEY_PASSWORD="$RELEASE_KEY_PASSWORD"
            unset BORSA_EXTERNAL_SIGNING
            gradle --no-daemon --stacktrace assembleRelease
            echo 'RELEASE_SIGNING=CI_SECRET' >> "$GITHUB_ENV"
          else
            export BORSA_EXTERNAL_SIGNING=1
            gradle --no-daemon --stacktrace assembleRelease
            echo 'RELEASE_SIGNING=UNAVAILABLE' >> "$GITHUB_ENV"
          fi
          gradle --no-daemon --stacktrace assembleDebug

      - name: Package and verify outputs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out
          BUILD_TOOLS="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)"
          RELEASE_APK="$(find release-src/android/app/build/outputs/apk/release -type f -name '*.apk' | head -1)"
          DEBUG_APK="$(find release-src/android/app/build/outputs/apk/debug -type f -name '*.apk' | head -1)"
          test -n "$RELEASE_APK" && test -n "$DEBUG_APK"
          if "$BUILD_TOOLS/apksigner" verify --verbose --print-certs "$RELEASE_APK" > out/release-signature.txt 2>&1; then
            cp "$RELEASE_APK" out/V6.1.1-MULTI-MARKET-VIOP-FIX-RELEASE.apk
            echo 'RELEASE_SIGNATURE=PASS' >> out/VERIFICATION.txt
          else
            "$BUILD_TOOLS/zipalign" -f -p 4 "$RELEASE_APK" out/V6.1.1-MULTI-MARKET-VIOP-FIX-UNSIGNED-ALIGNED.apk
            echo 'RELEASE_SIGNATURE=BLOCKED_NO_RELEASE_KEY' >> out/VERIFICATION.txt
          fi
          cp "$DEBUG_APK" out/V6.1.1-MULTI-MARKET-VIOP-FIX-DEBUG.apk
          "$BUILD_TOOLS/apksigner" verify --verbose --print-certs out/V6.1.1-MULTI-MARKET-VIOP-FIX-DEBUG.apk > out/debug-signature.txt
          "$BUILD_TOOLS/aapt" dump badging out/V6.1.1-MULTI-MARKET-VIOP-FIX-DEBUG.apk > out/debug-badging.txt
          grep -q "package: name='tr.borsatakip.v5' versionCode='611' versionName='6.1.1'" out/debug-badging.txt
          (cd release-src && zip -qr "$GITHUB_WORKSPACE/out/V6.1.1-MULTI-MARKET-VIOP-FIX-SOURCE.zip" android backend_v611 -x 'android/.gradle/*' 'android/**/build/*' 'backend_v611/**/__pycache__/*')
          cp /tmp/backend-*.txt out/
          printf 'HOME_FILTER_UNCHANGED=PASS\nMULTI_MARKET_ORCHESTRATION=TESTED\nBACKEND_REGRESSIONS=PASS\nPACKAGE=tr.borsatakip.v5\nVERSION=6.1.1/611\nRELEASE_SIGNING=%s\nPHYSICAL_DEVICE=NOT_RUN\nPRODUCTION_TRADEWIZE_ADAPTER=BLOCKED_SOURCE_NOT_PRESENT\n' "$RELEASE_SIGNING" >> out/VERIFICATION.txt
          sha256sum out/*.apk out/*.zip > out/SHA256SUMS.txt

      - name: Upload V6.1.1 fix package
        uses: actions/upload-artifact@v4
        with:
          name: V6.1.1-MULTI-MARKET-VIOP-FIX-PACKAGE
          if-no-files-found: error
          retention-days: 30
          path: out/*
