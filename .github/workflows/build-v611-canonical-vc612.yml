name: V6.1.1 Canonical VC612 APK

on:
  push:
    branches: [ v611-canonical-vc612-20260927 ]
    paths:
      - '.ci/v611-vc612-from-r3.patch.xz.b64'
      - '.github/workflows/build-v611-canonical-vc612.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  build-canonical-vc612:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    env:
      BORSA_EXTERNAL_SIGNING: '1'
      BORSA_BACKEND_URL: 'https://borsa-takip-backend-live-production.up.railway.app'
      BORSA_ATTESTATION_PUBLIC_KEYS: 'borsa-prod:v611-20260925:1:MFkwEwYHKoZIzj0CAQYIKoZIzj0DAQcDQgAEdDJwst8dTdL7v36TIKv+mbc2+br0pkbTdNiUHZMJpeOPUZAKNEGzua5m1Hs0c+KhhjCLt2ZrJ1k5TGtDfFE50g=='
      BORSA_BUILD_ID: 'V6.1.1-R4-VC612'
      BORSA_SOURCE_BASE_SHA256: '9f386f738ea86b27745380f1ef6e3f2bcba32e5048ea0aa9112996566a021797'
      R4_ARTIFACT_ID: '10924204160'
      R4_SOURCE_SHA256: 'd64cc395aea6fbdb076e845c6b87db745aef08ddc5e4d40f87f2850e774ce77b'
      R3_PATCH_XZ_SHA256: '22ba9b224be29b0d7751c8afabc0d5b15774d8b11c7f4b58bc1f21d99500c8c4'
      R3_ANDROID_TREE_SHA256: '12ed5f20f3d2a2219c19dc02f16f9028f093e1028df4b2b8af86b2256fdebaf2'
      VC612_PATCH_XZ_SHA256: '8d2c276925789867d148b77b0c133570bc8fecc410e48f89f7847d92acafba3b'
      VC612_ANDROID_TREE_SHA256: 'c805fbcbf4408b814a9b80d0cf68a421162a4ac913ccca899c8e05faf8d219d6'
      EXPECTED_PRODUCTION_CERT_SHA256: 'a99a0d4d699a47cc5e6e0ad7acb72eff42369191603bd8ba2bb8c2e202328ffd'

    steps:
      - name: Checkout canonical build branch
        uses: actions/checkout@v4

      - name: Stamp immutable build metadata
        shell: bash
        run: |
          set -euo pipefail
          echo "BORSA_GIT_COMMIT_SHA=${GITHUB_SHA}" >> "$GITHUB_ENV"
          echo "BORSA_BUILD_DATE_UTC=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_ENV"

      - name: Download and verify complete-source R4
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          curl -fL \
            -H 'Accept: application/vnd.github+json' \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${R4_ARTIFACT_ID}/zip" \
            -o /tmp/r4-artifact.zip
          mkdir -p /tmp/r4-artifact release-src
          unzip -q /tmp/r4-artifact.zip -d /tmp/r4-artifact
          test -f /tmp/r4-artifact/V6.1.1-COMPLETE-SOURCE-R4.zip
          echo "${R4_SOURCE_SHA256}  /tmp/r4-artifact/V6.1.1-COMPLETE-SOURCE-R4.zip" | sha256sum -c -
          unzip -q /tmp/r4-artifact/V6.1.1-COMPLETE-SOURCE-R4.zip -d release-src
          test -f release-src/android/app/build.gradle.kts
          echo 'R4_SOURCE_PROVENANCE=PASS'

      - name: Reconstruct exact canonical R3 Android base
        shell: bash
        run: |
          set -euo pipefail
          base64 -d .ci/v611-r3-from-r4-android.patch.xz.b64 > /tmp/r3.patch.xz
          echo "${R3_PATCH_XZ_SHA256}  /tmp/r3.patch.xz" | sha256sum -c -
          xz -t /tmp/r3.patch.xz
          xz -dc /tmp/r3.patch.xz > /tmp/r3.patch
          patch --batch --forward -p2 -d release-src/android < /tmp/r3.patch
          python - <<'PY'
          from pathlib import Path
          import hashlib, os
          root=Path('release-src/android')
          items=[]
          for p in sorted(x for x in root.rglob('*') if x.is_file()):
              rel=p.relative_to(root).as_posix()
              if rel.startswith('.gradle/') or '/build/' in f'/{rel}/':
                  continue
              items.append(f'{hashlib.sha256(p.read_bytes()).hexdigest()}  {rel}')
          manifest='\n'.join(items)+'\n'
          digest=hashlib.sha256(manifest.encode()).hexdigest()
          print(f'R3_ANDROID_FILE_COUNT={len(items)}')
          print(f'R3_ANDROID_TREE_SHA256={digest}')
          if len(items) != 362: raise SystemExit(f'Unexpected R3 file count: {len(items)}')
          if digest != os.environ['R3_ANDROID_TREE_SHA256']:
              raise SystemExit('R3 tree hash mismatch')
          print('R3_ANDROID_EXACT_TREE=PASS')
          PY

      - name: Apply canonical VC612 runtime overlay
        shell: bash
        run: |
          set -euo pipefail
          base64 -d .ci/v611-vc612-from-r3.patch.xz.b64 > /tmp/vc612.patch.xz
          echo "${VC612_PATCH_XZ_SHA256}  /tmp/vc612.patch.xz" | sha256sum -c -
          xz -t /tmp/vc612.patch.xz
          xz -dc /tmp/vc612.patch.xz > /tmp/vc612.patch
          patch --batch --forward -p2 -d release-src/android < /tmp/vc612.patch
          echo 'VC612_RUNTIME_OVERLAY_APPLIED=PASS'

      - name: Verify exact final canonical Android source tree
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import hashlib, os
          root=Path('release-src/android')
          items=[]
          for p in sorted(x for x in root.rglob('*') if x.is_file()):
              rel=p.relative_to(root).as_posix()
              if rel.startswith('.gradle/') or '/build/' in f'/{rel}/':
                  continue
              items.append(f'{hashlib.sha256(p.read_bytes()).hexdigest()}  {rel}')
          manifest='\n'.join(items)+'\n'
          digest=hashlib.sha256(manifest.encode()).hexdigest()
          print(f'VC612_ANDROID_FILE_COUNT={len(items)}')
          print(f'VC612_ANDROID_TREE_SHA256={digest}')
          if len(items) != 364: raise SystemExit(f'Unexpected VC612 file count: {len(items)}')
          if digest != os.environ['VC612_ANDROID_TREE_SHA256']:
              raise SystemExit(f'VC612 tree mismatch: {digest}')
          Path('VC612-ANDROID-MANIFEST.txt').write_text(manifest)
          print('VC612_ANDROID_EXACT_TREE=PASS')
          PY
          grep -Fq 'versionCode = 612' release-src/android/app/build.gradle.kts
          grep -Fq 'BUILD_ID' release-src/android/app/build.gradle.kts
          grep -Fq 'object CanonicalDirectionPolicy' release-src/android/app/src/main/java/tr/borsatakip/v5/data/CanonicalDirectionPolicy.kt
          grep -Fq 'authReady' release-src/android/app/src/main/java/tr/borsatakip/v5/data/MarketCapabilityClient.kt
          grep -Fq 'localViopConfigState' release-src/android/app/src/main/java/tr/borsatakip/v5/ui/ViopContractsActivity.kt
          grep -Fq 'localViopConfigState' release-src/android/app/src/main/java/tr/borsatakip/v5/ui/ViopDetailActivity.kt
          echo 'RUNTIME_SOURCE_ASSERTIONS=PASS'

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Test and build canonical VC612 APKs
        working-directory: release-src/android
        shell: bash
        run: |
          set -euo pipefail
          gradle --no-daemon --stacktrace testReleaseUnitTest assembleDebug assembleRelease

      - name: Verify APK binary and package provenance
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out
          BUILD_TOOLS="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)"
          DEBUG_APK="$(find release-src/android/app/build/outputs/apk/debug -type f -name '*.apk' | head -1)"
          RELEASE_APK="$(find release-src/android/app/build/outputs/apk/release -type f -name '*.apk' | head -1)"
          test -n "$DEBUG_APK" && test -n "$RELEASE_APK"

          cp "$DEBUG_APK" out/V6.1.1-VC612-CANONICAL-DEBUG.apk
          "$BUILD_TOOLS/zipalign" -f -p 4 "$RELEASE_APK" out/V6.1.1-VC612-CANONICAL-RELEASE-UNSIGNED.apk
          "$BUILD_TOOLS/zipalign" -c -v 4 out/V6.1.1-VC612-CANONICAL-RELEASE-UNSIGNED.apk > out/release-zipalign.txt

          "$BUILD_TOOLS/aapt" dump badging out/V6.1.1-VC612-CANONICAL-DEBUG.apk > out/debug-badging.txt
          "$BUILD_TOOLS/aapt" dump badging out/V6.1.1-VC612-CANONICAL-RELEASE-UNSIGNED.apk > out/release-badging.txt
          grep -q "package: name='tr.borsatakip.v5' versionCode='612' versionName='6.1.1'" out/debug-badging.txt
          grep -q "package: name='tr.borsatakip.v5' versionCode='612' versionName='6.1.1'" out/release-badging.txt
          grep -q '^application-debuggable$' out/debug-badging.txt
          if grep -q '^application-debuggable$' out/release-badging.txt; then echo 'release is debuggable' >&2; exit 1; fi

          "$BUILD_TOOLS/apksigner" verify --verbose --print-certs out/V6.1.1-VC612-CANONICAL-DEBUG.apk > out/debug-signature.txt
          if "$BUILD_TOOLS/apksigner" verify out/V6.1.1-VC612-CANONICAL-RELEASE-UNSIGNED.apk >/dev/null 2>&1; then
            echo 'release candidate unexpectedly signed' >&2; exit 1
          fi

          rm -rf /tmp/debug-dex /tmp/release-dex
          mkdir -p /tmp/debug-dex /tmp/release-dex
          unzip -q out/V6.1.1-VC612-CANONICAL-DEBUG.apk 'classes*.dex' -d /tmp/debug-dex
          unzip -q out/V6.1.1-VC612-CANONICAL-RELEASE-UNSIGNED.apk 'classes*.dex' -d /tmp/release-dex
          strings /tmp/debug-dex/classes*.dex > out/debug-dex-strings.txt
          strings /tmp/release-dex/classes*.dex > out/release-dex-strings.txt
          grep -Fq 'V6.1.1-R4-VC612' out/debug-dex-strings.txt
          grep -Fq "${BORSA_SOURCE_BASE_SHA256}" out/debug-dex-strings.txt
          grep -Fq 'CanonicalDirectionPolicy' out/debug-dex-strings.txt
          grep -Fq 'AUTH_NOT_READY' out/debug-dex-strings.txt
          grep -Fq 'localViopConfigState' out/debug-dex-strings.txt
          grep -Fq 'V6.1.1-R4-VC612' out/release-dex-strings.txt
          grep -Fq "${BORSA_SOURCE_BASE_SHA256}" out/release-dex-strings.txt
          echo 'APK_CONTAINS_CHANGE=PASS'

          cp VC612-ANDROID-MANIFEST.txt out/VC612-ANDROID-MANIFEST.txt
          if [ -f release-src/android/app/build/outputs/mapping/release/mapping.txt ]; then cp release-src/android/app/build/outputs/mapping/release/mapping.txt out/mapping.txt; fi
          (cd release-src && zip -qr "$GITHUB_WORKSPACE/out/V6.1.1-VC612-CANONICAL-SOURCE.zip" android -x 'android/.gradle/*' 'android/**/build/*')

          DEBUG_SHA=$(sha256sum out/V6.1.1-VC612-CANONICAL-DEBUG.apk | awk '{print $1}')
          RELEASE_SHA=$(sha256sum out/V6.1.1-VC612-CANONICAL-RELEASE-UNSIGNED.apk | awk '{print $1}')
          SOURCE_SHA=$(sha256sum out/V6.1.1-VC612-CANONICAL-SOURCE.zip | awk '{print $1}')
          python - <<PY
          import json, os
          data={
            'source_base_sha256': os.environ['BORSA_SOURCE_BASE_SHA256'],
            'git_commit_sha': os.environ['GITHUB_SHA'],
            'ci_run_id': os.environ['GITHUB_RUN_ID'],
            'build_id': os.environ['BORSA_BUILD_ID'],
            'build_date_utc': os.environ['BORSA_BUILD_DATE_UTC'],
            'version_name':'6.1.1',
            'version_code':612,
            'r3_android_tree_sha256': os.environ['R3_ANDROID_TREE_SHA256'],
            'final_android_tree_sha256': os.environ['VC612_ANDROID_TREE_SHA256'],
            'debug_apk_sha256':'${DEBUG_SHA}',
            'unsigned_release_apk_sha256':'${RELEASE_SHA}',
            'source_zip_sha256':'${SOURCE_SHA}',
            'expected_production_signer_sha256': os.environ['EXPECTED_PRODUCTION_CERT_SHA256'],
            'production_signing_pass': False,
            'device_pass': 'NOT_RUN',
            'provider_e2e_pass': 'NOT_RUN'
          }
          open('out/BUILD-PROVENANCE.json','w').write(json.dumps(data,indent=2,sort_keys=True)+'\n')
          PY
          sha256sum out/V6.1.1-VC612-CANONICAL-DEBUG.apk out/V6.1.1-VC612-CANONICAL-RELEASE-UNSIGNED.apk out/V6.1.1-VC612-CANONICAL-SOURCE.zip out/BUILD-PROVENANCE.json > out/SHA256SUMS.txt
          cat > out/BUILD-VERIFICATION.txt <<EOF
          SOURCE_PASS=PASS
          BUILD_PASS=PASS
          BINARY_PASS=PASS
          DEVICE_PASS=NOT_RUN
          PRODUCTION_SIGNING_PASS=NO_PRIVATE_KEY_IN_PUBLIC_CI
          PROVIDER_E2E_PASS=NOT_RUN
          PACKAGE=tr.borsatakip.v5
          VERSION=6.1.1/612
          BUILD_ID=${BORSA_BUILD_ID}
          SOURCE_BASE_SHA256=${BORSA_SOURCE_BASE_SHA256}
          FINAL_ANDROID_TREE_SHA256=${VC612_ANDROID_TREE_SHA256}
          APK_CONTAINS_CHANGE=PASS
          RELEASE_DEBUGGABLE=NO
          RELEASE_SIGNING=UNSIGNED_EXTERNAL_SIGNING_REQUIRED
          EOF

      - name: Upload canonical VC612 package
        uses: actions/upload-artifact@v4
        with:
          name: V6.1.1-VC612-CANONICAL-APK-PACKAGE
          if-no-files-found: error
          retention-days: 30
          path: |
            out/V6.1.1-VC612-CANONICAL-DEBUG.apk
            out/V6.1.1-VC612-CANONICAL-RELEASE-UNSIGNED.apk
            out/V6.1.1-VC612-CANONICAL-SOURCE.zip
            out/debug-badging.txt
            out/release-badging.txt
            out/debug-signature.txt
            out/release-zipalign.txt
            out/debug-dex-strings.txt
            out/release-dex-strings.txt
            out/VC612-ANDROID-MANIFEST.txt
            out/BUILD-PROVENANCE.json
            out/BUILD-VERIFICATION.txt
            out/SHA256SUMS.txt
            out/mapping.txt
