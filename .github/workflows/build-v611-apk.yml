name: V6.1.1 Verified Overlay APK Build

on:
  push:
    branches: [ main ]
    paths:
      - '.ci/v611-overlay-r3/**'
      - '.github/workflows/build-v611-apk.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-test-build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout V6.1.1 payload repository
        uses: actions/checkout@v4

      - name: Checkout pinned V5 Android base
        uses: actions/checkout@v4
        with:
          repository: dilekari-droid/v5.1.1
          ref: 28c18f669970f5a7621e89b80179c63c94b6f7aa
          path: base-v5

      - name: Reconstruct and verify V6.1.1 overlay
        shell: bash
        run: |
          set -euo pipefail
          ROOT='.ci/v611-overlay-r3'
          PARTS=(
            part00.b64 part01.b64 part02.b64 part03.b64 part04.b64
            part05a.b64 part05b.b64 part06a.b64 part06b.b64
            part07a.b64 part07b.b64 part08a.b64 part08b.b64 part09.b64
          )
          : > /tmp/v611-overlay.b64
          for part in "${PARTS[@]}"; do
            test -s "$ROOT/$part"
            cat "$ROOT/$part" >> /tmp/v611-overlay.b64
          done
          test "$(wc -c < /tmp/v611-overlay.b64)" -eq 73804
          base64 -d /tmp/v611-overlay.b64 > /tmp/v611-overlay.tar.xz
          echo '29989105d1adb64dcd6fb4a514f803adebfd693b07fe3ddbfe775127751e04fc  /tmp/v611-overlay.tar.xz' | sha256sum -c -
          xz --test /tmp/v611-overlay.tar.xz

      - name: Apply V6.1.1 overlay to pinned base
        shell: bash
        run: |
          set -euo pipefail
          ANDROID_DIR="$GITHUB_WORKSPACE/base-v5/android"
          test -f "$ANDROID_DIR/settings.gradle.kts"
          tar -xJf /tmp/v611-overlay.tar.xz -C "$ANDROID_DIR"
          test -f "$ANDROID_DIR/DELETE-LIST.txt"
          while IFS= read -r rel; do
            test -n "$rel" || continue
            rm -f -- "$ANDROID_DIR/$rel"
          done < "$ANDROID_DIR/DELETE-LIST.txt"
          rm -f "$ANDROID_DIR/DELETE-LIST.txt"

          grep -q 'applicationId = "tr.borsatakip.v5"' "$ANDROID_DIR/app/build.gradle.kts"
          grep -q 'versionCode = 556' "$ANDROID_DIR/app/build.gradle.kts"
          grep -q 'versionName = "5.4.16"' "$ANDROID_DIR/app/build.gradle.kts"
          test "$(git hash-object "$ANDROID_DIR/app/build.gradle.kts")" = 'd9b3b2e00a804395dd92e4d54f6045a662ea424f'
          test -f "$ANDROID_DIR/app/src/main/java/tr/borsatakip/v5/data/ManualScanProgressPolicy.kt"
          test -f "$ANDROID_DIR/app/src/main/java/tr/borsatakip/v5/data/SnapshotBatchPolicy.kt"
          test -f "$ANDROID_DIR/app/src/main/java/tr/borsatakip/v5/ui/ViopDashboardUiState.kt"
          test -f "$ANDROID_DIR/app/src/main/java/tr/borsatakip/v5/worker/BistScanForegroundService.kt"
          test ! -e "$ANDROID_DIR/app/src/main/java/tr/borsatakip/v5/data/BackendUrlPolicy.kt"
          test ! -e "$ANDROID_DIR/app/src/main/java/tr/borsatakip/v5/research/ResearchFoundationEngine.kt"
          echo "ANDROID_DIR=$ANDROID_DIR" >> "$GITHUB_ENV"
          echo 'SELECTED_SOURCE=v5.1.1@28c18f669970f5a7621e89b80179c63c94b6f7aa + verified V6.1.1 R3 overlay' >> "$GITHUB_ENV"

      - name: Apply V6.1.1 compile fixes
        shell: bash
        run: |
          set -euo pipefail
          ANDROID_DIR="$GITHUB_WORKSPACE/base-v5/android"
          SRC_ROOT="$ANDROID_DIR/app/src/main/java/tr/borsatakip/v5"

          # R3 kept ResearchPolicies/NewsResearchAdapter but removed their model types.
          git -C "$GITHUB_WORKSPACE/base-v5" show HEAD:android/app/src/main/java/tr/borsatakip/v5/research/ResearchModels.kt \
            > "$SRC_ROOT/research/ResearchModels.kt"

          # R3 BackendSessionClient depends on this new single-flight primitive.
          cat > "$SRC_ROOT/data/SessionRefreshGate.kt" <<'KOTLIN'
          package tr.borsatakip.v5.data

          import kotlinx.coroutines.sync.Mutex
          import kotlinx.coroutines.sync.withLock

          /** Process-wide refresh single-flight primitive. */
          class SessionRefreshGate {
              private val mutex = Mutex()

              suspend fun run(
                  isSatisfied: () -> Boolean,
                  refresh: suspend () -> Boolean
              ): Boolean = mutex.withLock {
                  if (isSatisfied()) true else refresh()
              }
          }
          KOTLIN

          python - <<'PY'
          from pathlib import Path

          root = Path('base-v5/android/app/src/main/java/tr/borsatakip/v5')

          settings = root / 'data/SettingsStore.kt'
          lines = settings.read_text().splitlines()
          starts = [i for i, line in enumerate(lines) if line.strip() == 'companion object {']
          if len(starts) != 2:
              raise SystemExit(f'SettingsStore expected 2 companion objects, got {len(starts)}')

          def find_block_end(start):
              depth = 0
              for i in range(start, len(lines)):
                  depth += lines[i].count('{') - lines[i].count('}')
                  if depth == 0:
                      return i
              raise SystemExit('SettingsStore companion object is not closed')

          first_start, second_start = starts
          first_end = find_block_end(first_start)
          second_end = find_block_end(second_start)
          second_body = lines[second_start + 1:second_end]
          lines = lines[:second_start] + lines[second_end + 1:]
          lines = lines[:first_end] + second_body + lines[first_end:]
          settings.write_text('\n'.join(lines) + '\n')

          old = 'stock?.candles?.takeIf { it.size >= 2 }?.get(it.lastIndex - 1)?.close'
          new = 'stock?.candles?.takeIf { it.size >= 2 }?.let { it[it.lastIndex - 1].close }'
          for rel in ('ui/BistScanActivity.kt', 'ui/OpportunityActivity.kt', 'ui/ViopActivity.kt'):
              path = root / rel
              body = path.read_text()
              if body.count(old) != 1:
                  raise SystemExit(f'{rel}: expected exactly one UI scope pattern')
              path.write_text(body.replace(old, new, 1))
          PY

          test "$(git hash-object "$SRC_ROOT/data/SessionRefreshGate.kt")" = '97aff01ee90011db6fcd82f27e4730060c2f2cc1'
          test "$(git hash-object "$SRC_ROOT/data/SettingsStore.kt")" = '199a3c8075e2d6d8a9ca543485ad822cade8c6f8'
          test "$(git hash-object "$SRC_ROOT/research/ResearchModels.kt")" = 'f8e1e965936659f7822bbc558ed9aab434bd6b4b'
          test "$(git hash-object "$SRC_ROOT/ui/BistScanActivity.kt")" = 'bb44655d5a665f359af06e8746b9f8e4b361d31c'
          test "$(git hash-object "$SRC_ROOT/ui/OpportunityActivity.kt")" = '35c5113ec523c1b836b49e0427ee7e51e7103528'
          test "$(git hash-object "$SRC_ROOT/ui/ViopActivity.kt")" = '4023bf607f95e85b625f9915944dafab234b9c75'
          test "$(grep -c 'companion object' "$SRC_ROOT/data/SettingsStore.kt")" -eq 1
          ! grep -R -F 'takeIf { it.size >= 2 }?.get(it.lastIndex - 1)' "$SRC_ROOT/ui"
          echo 'SELECTED_SOURCE=v5.1.1@28c18f669970f5a7621e89b80179c63c94b6f7aa + verified V6.1.1 R3 overlay + compile fixes' >> "$GITHUB_ENV"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Run Android unit tests
        shell: bash
        working-directory: ${{ env.ANDROID_DIR }}
        run: gradle --no-daemon --stacktrace testDebugUnitTest

      - name: Build debug APK
        shell: bash
        working-directory: ${{ env.ANDROID_DIR }}
        run: gradle --no-daemon --stacktrace assembleDebug

      - name: Locate and verify APK
        shell: bash
        run: |
          set -euo pipefail
          APK="$(find "$ANDROID_DIR/app/build/outputs/apk/debug" -type f -name '*.apk' | head -1)"
          test -n "$APK"
          mkdir -p out
          cp "$APK" out/V6.1.1-debug.apk
          sha256sum out/V6.1.1-debug.apk | tee out/V6.1.1-debug.apk.sha256
          printf 'source=%s\n' "$SELECTED_SOURCE" | tee out/V6.1.1-source.txt
          BUILD_TOOLS="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)"
          test -x "$BUILD_TOOLS/aapt"
          test -x "$BUILD_TOOLS/apksigner"
          "$BUILD_TOOLS/aapt" dump badging out/V6.1.1-debug.apk | tee out/V6.1.1-badging.txt
          "$BUILD_TOOLS/apksigner" verify --verbose --print-certs out/V6.1.1-debug.apk | tee out/V6.1.1-signature.txt
          grep -q "package: name='tr.borsatakip.v5' versionCode='556' versionName='5.4.16'" out/V6.1.1-badging.txt

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: V6.1.1-APK
          path: out/*
          if-no-files-found: error
          retention-days: 30
