name: V6.1.1 Source Verify and Manual APK Build

on:
  push:
    branches: [ main ]
    paths:
      - '.ci/v611-source/**'
      - '.github/workflows/build-v611-apk.yml'
      - 'PREAPK-R4-SYNC-PLAN.md'
  workflow_dispatch:
    inputs:
      confirm_build:
        description: 'Explicitly allow debug APK generation'
        required: true
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  source-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout V6.1.1 repository
        uses: actions/checkout@v4

      - name: Reconstruct and verify V6.1.1 Android source
        shell: bash
        run: |
          set -euo pipefail
          test -d .ci/v611-source
          mapfile -t parts < <(find .ci/v611-source -maxdepth 1 -type f -name 'part*.b64' | sort -V)
          test "${#parts[@]}" -gt 0
          cat "${parts[@]}" | tr -d '\r\n' | base64 --decode > /tmp/v611-source.tar.xz
          xz --test /tmp/v611-source.tar.xz
          mkdir -p /tmp/v611-src
          tar -xJf /tmp/v611-source.tar.xz -C /tmp/v611-src
          ANDROID_DIR="$(find /tmp/v611-src -type f -name settings.gradle.kts -printf '%h\n' | head -1)"
          test -n "$ANDROID_DIR"
          test -f "$ANDROID_DIR/app/build.gradle.kts"
          grep -q 'applicationId = "tr.borsatakip.v5"' "$ANDROID_DIR/app/build.gradle.kts"
          grep -q 'versionCode = 556' "$ANDROID_DIR/app/build.gradle.kts"
          grep -q 'versionName = "5.4.16"' "$ANDROID_DIR/app/build.gradle.kts"
          echo 'V6.1.1 source reconstruction/identity PASS; no APK generated.'

  build-apk:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.confirm_build }}
    needs: source-verify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout V6.1.1 repository
        uses: actions/checkout@v4

      - name: Reconstruct V6.1.1 Android source
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t parts < <(find .ci/v611-source -maxdepth 1 -type f -name 'part*.b64' | sort -V)
          test "${#parts[@]}" -gt 0
          cat "${parts[@]}" | tr -d '\r\n' | base64 --decode > /tmp/v611-source.tar.xz
          xz --test /tmp/v611-source.tar.xz
          mkdir -p /tmp/v611-src
          tar -xJf /tmp/v611-source.tar.xz -C /tmp/v611-src
          ANDROID_DIR="$(find /tmp/v611-src -type f -name settings.gradle.kts -printf '%h\n' | head -1)"
          test -n "$ANDROID_DIR"
          echo "ANDROID_DIR=$ANDROID_DIR" >> "$GITHUB_ENV"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Build debug APK
        shell: bash
        working-directory: ${{ env.ANDROID_DIR }}
        run: gradle --no-daemon --stacktrace assembleDebug

      - name: Locate and verify APK
        shell: bash
        run: |
          set -euo pipefail
          APK="$(find "$ANDROID_DIR/app/build/outputs/apk/debug" -type f -name '*.apk' | head -1)"
          test -n "$APK"
          mkdir -p out
          cp "$APK" out/V6.1.1-debug.apk
          sha256sum "$APK" | tee out/V6.1.1-debug.apk.sha256
          BUILD_TOOLS="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)"
          "$BUILD_TOOLS/aapt" dump badging "$APK" | tee out/V6.1.1-badging.txt
          "$BUILD_TOOLS/apksigner" verify --verbose --print-certs "$APK" | tee out/V6.1.1-signature.txt
          grep -q "package: name='tr.borsatakip.v5' versionCode='556' versionName='5.4.16'" out/V6.1.1-badging.txt

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: V6.1.1-APK
          path: out/*
          if-no-files-found: error
          retention-days: 30
