name: V6.1.1 R3 Recover and APK Build

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/build-v611-apk.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  recover-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout V6.1.1 repository
        uses: actions/checkout@v4

      - name: Recover and verify R3 Android payload
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import base64
          import hashlib
          import lzma

          root = Path('.ci/v611-android-build-r3')
          files = [root / f'part{i:02d}.b64' for i in range(6)]
          if not all(p.is_file() for p in files):
              raise SystemExit('R3 payload parts are missing')

          parts = [''.join(p.read_text().split()) for p in files]
          lengths = [len(x) for x in parts]
          print('R3 part lengths:', lengths)
          if lengths != [12000, 19999, 19999, 19999, 19999, 14776]:
              raise SystemExit(f'Unexpected R3 part layout: {lengths}')

          alphabet = 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789+/'
          repaired = parts[0]
          recovered = []

          for i in range(1, 5):
              survivors = []
              for ch in alphabet:
                  prefix = repaired + parts[i] + ch
                  if i < 4:
                      probe = prefix + parts[i + 1]
                      probe = probe[:len(probe) - (len(probe) % 4)]
                  else:
                      probe = prefix + parts[5]
                  try:
                      raw = base64.b64decode(probe, validate=True)
                      dec = lzma.LZMADecompressor(format=lzma.FORMAT_XZ)
                      dec.decompress(raw)
                      if i == 4 and not dec.eof:
                          continue
                      survivors.append(ch)
                  except (ValueError, lzma.LZMAError):
                      pass
              print(f'boundary {i}: survivors={survivors}')
              if len(survivors) != 1:
                  raise SystemExit(f'Could not uniquely recover boundary {i}: {survivors}')
              recovered.append(survivors[0])
              repaired += parts[i] + survivors[0]

          repaired += parts[5]
          raw = base64.b64decode(repaired, validate=True)
          try:
              out = lzma.decompress(raw, format=lzma.FORMAT_XZ)
          except lzma.LZMAError as exc:
              raise SystemExit(f'Recovered payload failed XZ verification: {exc}')

          Path('/tmp/v611-r3-android.tar.xz').write_bytes(raw)
          print('Recovered chars:', ''.join(recovered))
          print('Recovered payload bytes:', len(raw))
          print('Recovered payload SHA256:', hashlib.sha256(raw).hexdigest())
          print('Decompressed tar bytes:', len(out))
          PY

          xz --test /tmp/v611-r3-android.tar.xz
          rm -rf /tmp/v611-src
          mkdir -p /tmp/v611-src
          tar -xJf /tmp/v611-r3-android.tar.xz -C /tmp/v611-src
          ANDROID_DIR="$(find /tmp/v611-src -type f -name settings.gradle.kts -printf '%h\n' | head -1)"
          test -n "$ANDROID_DIR"
          test -f "$ANDROID_DIR/app/build.gradle.kts"
          grep -q 'applicationId = "tr.borsatakip.v5"' "$ANDROID_DIR/app/build.gradle.kts"
          grep -q 'versionCode = 556' "$ANDROID_DIR/app/build.gradle.kts"
          grep -q 'versionName = "5.4.16"' "$ANDROID_DIR/app/build.gradle.kts"
          test -f "$ANDROID_DIR/app/src/main/java/tr/borsatakip/v5/data/ManualScanProgressPolicy.kt"
          echo "ANDROID_DIR=$ANDROID_DIR" >> "$GITHUB_ENV"
          echo 'SELECTED_SOURCE=.ci/v611-android-build-r3 (recovered)' >> "$GITHUB_ENV"
          echo "Recovered V6.1.1 Android source: $ANDROID_DIR"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Run Android unit tests
        shell: bash
        working-directory: ${{ env.ANDROID_DIR }}
        run: gradle --no-daemon --stacktrace testDebugUnitTest

      - name: Build debug APK
        shell: bash
        working-directory: ${{ env.ANDROID_DIR }}
        run: gradle --no-daemon --stacktrace assembleDebug

      - name: Locate and verify APK
        shell: bash
        run: |
          set -euo pipefail
          APK="$(find "$ANDROID_DIR/app/build/outputs/apk/debug" -type f -name '*.apk' | head -1)"
          test -n "$APK"
          mkdir -p out
          cp "$APK" out/V6.1.1-debug.apk
          sha256sum "$APK" | tee out/V6.1.1-debug.apk.sha256
          printf 'source=%s\n' "$SELECTED_SOURCE" | tee out/V6.1.1-source.txt
          BUILD_TOOLS="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)"
          "$BUILD_TOOLS/aapt" dump badging "$APK" | tee out/V6.1.1-badging.txt
          "$BUILD_TOOLS/apksigner" verify --verbose --print-certs "$APK" | tee out/V6.1.1-signature.txt
          grep -q "package: name='tr.borsatakip.v5' versionCode='556' versionName='5.4.16'" out/V6.1.1-badging.txt

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: V6.1.1-APK
          path: out/*
          if-no-files-found: error
          retention-days: 30
