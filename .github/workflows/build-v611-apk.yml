name: Build V6.1.1 APK

on:
  push:
    branches: [ main ]
    paths:
      - '.ci/v611-source/**'
      - '.github/workflows/build-v611-apk.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout V6.1.1 repository
        uses: actions/checkout@v4

      - name: Reconstruct V6.1.1 Android source
        shell: bash
        run: |
          set -euo pipefail
          test -d .ci/v611-source
          mapfile -t parts < <(find .ci/v611-source -maxdepth 1 -type f -name 'part*.b64' | sort -V)
          test "${#parts[@]}" -gt 0
          cat "${parts[@]}" | tr -d '\r\n' | base64 --decode > /tmp/v611-source.tar.xz
          xz --test /tmp/v611-source.tar.xz
          mkdir -p /tmp/v611-src
          tar -xJf /tmp/v611-source.tar.xz -C /tmp/v611-src
          echo "Extracted source tree:"
          find /tmp/v611-src -maxdepth 3 -type f | sort | head -80
          ANDROID_DIR="$(find /tmp/v611-src -type f -name settings.gradle.kts -printf '%h\n' | head -1)"
          test -n "$ANDROID_DIR"
          echo "ANDROID_DIR=$ANDROID_DIR" >> "$GITHUB_ENV"
          echo "Source directory: $ANDROID_DIR"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Verify Android project identity
        shell: bash
        run: |
          set -euo pipefail
          test -f "$ANDROID_DIR/app/build.gradle.kts"
          grep -q 'applicationId = "tr.borsatakip.v5"' "$ANDROID_DIR/app/build.gradle.kts"
          grep -q 'versionCode = 556' "$ANDROID_DIR/app/build.gradle.kts"
          grep -q 'versionName = "5.4.16"' "$ANDROID_DIR/app/build.gradle.kts"

      - name: Build debug APK
        shell: bash
        working-directory: ${{ env.ANDROID_DIR }}
        run: |
          set -euo pipefail
          gradle --no-daemon --stacktrace assembleDebug

      - name: Locate and verify APK
        id: apk
        shell: bash
        run: |
          set -euo pipefail
          APK="$(find "$ANDROID_DIR/app/build/outputs/apk/debug" -type f -name '*.apk' | head -1)"
          test -n "$APK"
          echo "APK=$APK" >> "$GITHUB_ENV"
          echo "apk_path=$APK" >> "$GITHUB_OUTPUT"
          ls -lh "$APK"
          sha256sum "$APK" | tee /tmp/V6.1.1-APK.sha256
          BUILD_TOOLS="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)"
          "$BUILD_TOOLS/aapt" dump badging "$APK" | tee /tmp/V6.1.1-badging.txt
          "$BUILD_TOOLS/apksigner" verify --verbose --print-certs "$APK" | tee /tmp/V6.1.1-signature.txt
          grep -q "package: name='tr.borsatakip.v5' versionCode='556' versionName='5.4.16'" /tmp/V6.1.1-badging.txt

      - name: Prepare named APK
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out
          cp "$APK" out/V6.1.1-debug.apk
          cp /tmp/V6.1.1-APK.sha256 out/V6.1.1-debug.apk.sha256
          cp /tmp/V6.1.1-badging.txt out/V6.1.1-badging.txt
          cp /tmp/V6.1.1-signature.txt out/V6.1.1-signature.txt

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: V6.1.1-APK
          path: out/*
          if-no-files-found: error
          retention-days: 30
