name: V6.1.1 Verified Overlay APK Build

on:
  push:
    branches: [ main ]
    paths:
      - '.ci/v611-overlay-r3/**'
      - '.github/workflows/build-v611-apk.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-test-build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout V6.1.1 payload repository
        uses: actions/checkout@v4

      - name: Checkout pinned V5 Android base
        uses: actions/checkout@v4
        with:
          repository: dilekari-droid/v5.1.1
          ref: 28c18f669970f5a7621e89b80179c63c94b6f7aa
          path: base-v5

      - name: Reconstruct and verify V6.1.1 overlay
        shell: bash
        run: |
          set -euo pipefail
          ROOT='.ci/v611-overlay-r3'
          PARTS=(
            part00.b64 part01.b64 part02.b64 part03.b64 part04.b64
            part05a.b64 part05b.b64 part06a.b64 part06b.b64
            part07a.b64 part07b.b64 part08a.b64 part08b.b64 part09.b64
          )
          : > /tmp/v611-overlay.b64
          for part in "${PARTS[@]}"; do
            test -s "$ROOT/$part"
            cat "$ROOT/$part" >> /tmp/v611-overlay.b64
          done
          test "$(wc -c < /tmp/v611-overlay.b64)" -eq 73804
          base64 -d /tmp/v611-overlay.b64 > /tmp/v611-overlay.tar.xz
          echo '29989105d1adb64dcd6fb4a514f803adebfd693b07fe3ddbfe775127751e04fc  /tmp/v611-overlay.tar.xz' | sha256sum -c -
          xz --test /tmp/v611-overlay.tar.xz

      - name: Apply V6.1.1 overlay to pinned base
        shell: bash
        run: |
          set -euo pipefail
          ANDROID_DIR="$GITHUB_WORKSPACE/base-v5/android"
          test -f "$ANDROID_DIR/settings.gradle.kts"
          tar -xJf /tmp/v611-overlay.tar.xz -C "$ANDROID_DIR"
          test -f "$ANDROID_DIR/DELETE-LIST.txt"
          while IFS= read -r rel; do
            test -n "$rel" || continue
            rm -f -- "$ANDROID_DIR/$rel"
          done < "$ANDROID_DIR/DELETE-LIST.txt"
          rm -f "$ANDROID_DIR/DELETE-LIST.txt"

          grep -q 'applicationId = "tr.borsatakip.v5"' "$ANDROID_DIR/app/build.gradle.kts"
          grep -q 'versionCode = 556' "$ANDROID_DIR/app/build.gradle.kts"
          grep -q 'versionName = "5.4.16"' "$ANDROID_DIR/app/build.gradle.kts"
          test "$(git hash-object "$ANDROID_DIR/app/build.gradle.kts")" = 'd9b3b2e00a804395dd92e4d54f6045a662ea424f'
          test -f "$ANDROID_DIR/app/src/main/java/tr/borsatakip/v5/data/ManualScanProgressPolicy.kt"
          test -f "$ANDROID_DIR/app/src/main/java/tr/borsatakip/v5/data/SnapshotBatchPolicy.kt"
          test -f "$ANDROID_DIR/app/src/main/java/tr/borsatakip/v5/ui/ViopDashboardUiState.kt"
          test -f "$ANDROID_DIR/app/src/main/java/tr/borsatakip/v5/worker/BistScanForegroundService.kt"
          test ! -e "$ANDROID_DIR/app/src/main/java/tr/borsatakip/v5/data/BackendUrlPolicy.kt"
          test ! -e "$ANDROID_DIR/app/src/main/java/tr/borsatakip/v5/research/ResearchFoundationEngine.kt"
          echo "ANDROID_DIR=$ANDROID_DIR" >> "$GITHUB_ENV"
          echo 'SELECTED_SOURCE=v5.1.1@28c18f669970f5a7621e89b80179c63c94b6f7aa + verified V6.1.1 R3 overlay' >> "$GITHUB_ENV"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Run Android unit tests
        shell: bash
        working-directory: ${{ env.ANDROID_DIR }}
        run: gradle --no-daemon --stacktrace testDebugUnitTest

      - name: Build debug APK
        shell: bash
        working-directory: ${{ env.ANDROID_DIR }}
        run: gradle --no-daemon --stacktrace assembleDebug

      - name: Locate and verify APK
        shell: bash
        run: |
          set -euo pipefail
          APK="$(find "$ANDROID_DIR/app/build/outputs/apk/debug" -type f -name '*.apk' | head -1)"
          test -n "$APK"
          mkdir -p out
          cp "$APK" out/V6.1.1-debug.apk
          sha256sum out/V6.1.1-debug.apk | tee out/V6.1.1-debug.apk.sha256
          printf 'source=%s\n' "$SELECTED_SOURCE" | tee out/V6.1.1-source.txt
          BUILD_TOOLS="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)"
          test -x "$BUILD_TOOLS/aapt"
          test -x "$BUILD_TOOLS/apksigner"
          "$BUILD_TOOLS/aapt" dump badging out/V6.1.1-debug.apk | tee out/V6.1.1-badging.txt
          "$BUILD_TOOLS/apksigner" verify --verbose --print-certs out/V6.1.1-debug.apk | tee out/V6.1.1-signature.txt
          grep -q "package: name='tr.borsatakip.v5' versionCode='556' versionName='5.4.16'" out/V6.1.1-badging.txt

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: V6.1.1-APK
          path: out/*
          if-no-files-found: error
          retention-days: 30
