name: V6.1.1 Candidate Probe and APK Build

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/build-v611-apk.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout V6.1.1 repository
        uses: actions/checkout@v4

      - name: Probe existing Android source payloads
        shell: bash
        run: |
          set -u
          candidates=(
            .ci/v611-android-final10k
            .ci/v611-android-build-r3
            .ci/v611-android-r3
            .ci/v611-apk-r3
            .ci/v611-r3
            .ci/v611-r4-android-xz
            .ci/v611-source
            source-transfer
            source_parts
          )
          selected=''
          for dir in "${candidates[@]}"; do
            [ -d "$dir" ] || continue
            mapfile -t parts < <(find "$dir" -maxdepth 1 -type f -name 'part*.b64' | sort -V)
            if [ "${#parts[@]}" -eq 0 ]; then
              mapfile -t parts < <(find "$dir" -maxdepth 1 -type f -name 'chunk*.b64' | sort -V)
            fi
            [ "${#parts[@]}" -gt 0 ] || continue
            echo "PROBE $dir parts=${#parts[@]}"
            rm -rf /tmp/v611-probe /tmp/v611-payload.bin
            mkdir -p /tmp/v611-probe
            if ! cat "${parts[@]}" | tr -d '\r\n' | base64 --decode > /tmp/v611-payload.bin 2>/tmp/base64.err; then
              echo "REJECT $dir base64"
              continue
            fi
            sha256sum /tmp/v611-payload.bin || true
            if xz --test /tmp/v611-payload.bin >/dev/null 2>&1; then
              if ! tar -xJf /tmp/v611-payload.bin -C /tmp/v611-probe >/dev/null 2>&1; then
                echo "REJECT $dir tar-xz"
                continue
              fi
            elif unzip -tqq /tmp/v611-payload.bin >/dev/null 2>&1; then
              if ! unzip -q /tmp/v611-payload.bin -d /tmp/v611-probe; then
                echo "REJECT $dir zip"
                continue
              fi
            else
              echo "REJECT $dir archive"
              continue
            fi
            ANDROID_DIR="$(find /tmp/v611-probe -type f -name settings.gradle.kts -printf '%h\n' | head -1)"
            [ -n "$ANDROID_DIR" ] || { echo "REJECT $dir no-settings"; continue; }
            [ -f "$ANDROID_DIR/app/build.gradle.kts" ] || { echo "REJECT $dir no-app-gradle"; continue; }
            grep -q 'applicationId = "tr.borsatakip.v5"' "$ANDROID_DIR/app/build.gradle.kts" || { echo "REJECT $dir app-id"; continue; }
            grep -q 'versionCode = 556' "$ANDROID_DIR/app/build.gradle.kts" || { echo "REJECT $dir version-code"; continue; }
            grep -q 'versionName = "5.4.16"' "$ANDROID_DIR/app/build.gradle.kts" || { echo "REJECT $dir version-name"; continue; }
            [ -f "$ANDROID_DIR/app/src/main/java/tr/borsatakip/v5/data/ManualScanProgressPolicy.kt" ] || { echo "REJECT $dir missing-progress-policy"; continue; }
            selected="$dir"
            echo "SELECTED_SOURCE=$selected" >> "$GITHUB_ENV"
            echo "ANDROID_DIR=$ANDROID_DIR" >> "$GITHUB_ENV"
            echo "SELECTED $selected -> $ANDROID_DIR"
            break
          done
          if [ -z "$selected" ]; then
            echo 'No complete verified Android payload with R3 progress policy found.' >&2
            exit 1
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Run Android unit tests
        shell: bash
        working-directory: ${{ env.ANDROID_DIR }}
        run: gradle --no-daemon --stacktrace testDebugUnitTest

      - name: Build debug APK
        shell: bash
        working-directory: ${{ env.ANDROID_DIR }}
        run: gradle --no-daemon --stacktrace assembleDebug

      - name: Locate and verify APK
        shell: bash
        run: |
          set -euo pipefail
          APK="$(find "$ANDROID_DIR/app/build/outputs/apk/debug" -type f -name '*.apk' | head -1)"
          test -n "$APK"
          mkdir -p out
          cp "$APK" out/V6.1.1-debug.apk
          sha256sum "$APK" | tee out/V6.1.1-debug.apk.sha256
          printf 'source=%s\n' "$SELECTED_SOURCE" | tee out/V6.1.1-source.txt
          BUILD_TOOLS="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)"
          "$BUILD_TOOLS/aapt" dump badging "$APK" | tee out/V6.1.1-badging.txt
          "$BUILD_TOOLS/apksigner" verify --verbose --print-certs "$APK" | tee out/V6.1.1-signature.txt
          grep -q "package: name='tr.borsatakip.v5' versionCode='556' versionName='5.4.16'" out/V6.1.1-badging.txt

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: V6.1.1-APK
          path: out/*
          if-no-files-found: error
          retention-days: 30
